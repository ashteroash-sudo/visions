<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestionnaire de scène — Prototype</title>
<style>
  :root {
    --bg-void: #0a0e12;
    --panel: #10171d;
    --panel-edge: #1c2830;
    --ink: #d8e2e6;
    --ink-dim: #7c8f97;
    --gold: #c9a961;
    --gold-soft: rgba(201, 169, 97, 0.35);
    --danger: #8a3a3a;
    --edit: #4a90a4;
    font-size: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg-void);
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* ---------- Topbar ---------- */
  #topbar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-edge);
    flex-shrink: 0;
    z-index: 50;
  }
  #topbar .title {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    color: var(--gold);
    font-size: 1.05rem;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .mode-switch {
    display: flex;
    background: var(--bg-void);
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    overflow: hidden;
  }
  .mode-switch button {
    background: none;
    border: none;
    color: var(--ink-dim);
    padding: 7px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .mode-switch button.active {
    background: var(--gold-soft);
    color: var(--gold);
  }
  .mode-switch button:hover:not(.active) {
    color: var(--ink);
    background: rgba(255,255,255,0.04);
  }
  #breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    color: var(--ink-dim);
    flex-wrap: wrap;
    flex: 1;
    min-width: 0;
  }
  #breadcrumb .crumb {
    cursor: pointer;
    padding: 3px 8px;
    border-radius: 5px;
    white-space: nowrap;
  }
  #breadcrumb .crumb:hover { background: rgba(255,255,255,0.06); color: var(--ink); }
  #breadcrumb .crumb.current { color: var(--gold); cursor: default; }
  #breadcrumb .crumb.current:hover { background: none; }
  #breadcrumb .sep { color: var(--panel-edge); }

  #audio-toggle {
    background: none;
    border: 1px solid var(--panel-edge);
    color: var(--ink-dim);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  #audio-toggle.on { color: var(--gold); border-color: var(--gold-soft); }

  #disk-open-root {
    background: none;
    border: 1px solid var(--panel-edge);
    color: var(--ink-dim);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  #launch-player-window {
    background: none;
    border: 1px solid var(--edit);
    color: var(--edit);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  #launch-player-window:hover { background: var(--edit); color: #06181e; }
  #scenes-mosaic-toggle {
    background: none;
    border: 1px solid var(--panel-edge);
    color: var(--ink-dim);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  #scenes-mosaic-toggle:hover { border-color: var(--gold-soft); color: var(--gold); }
  #scenes-mosaic-toggle.active { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
  #music-volume {
    width: 80px;
    accent-color: var(--gold);
  }
  body.mode-player #music-volume { display: none !important; }

  #disk-delete-scene {
    background: none;
    border: 1px solid var(--danger);
    color: #e08a8a;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }

  #draw-toggle {
    background: none;
    border: 1px solid var(--edit);
    color: var(--edit);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
    display: none;
  }
  body.mode-edit #draw-toggle { display: inline-block; }
  #draw-toggle.on { background: var(--edit); color: #06181e; }

  /* ---------- Layout ---------- */
  #body-layout {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #stage-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    min-width: 0;
  }
  #stage {
    position: relative;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 768 / 512;
    width: min(100%, calc((100vh - 60px) * 768 / 512));
  }
  #stage img.bg {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    user-select: none;
    -webkit-user-drag: none;
  }
  #stage svg.zones {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .zone-shape {
    fill: rgba(201, 169, 97, 0.0);
    stroke: transparent;
    stroke-width: 2;
    cursor: pointer;
    transition: fill .15s, stroke .15s;
    vector-effect: non-scaling-stroke;
  }
  body.mode-edit .zone-shape {
    fill: rgba(74, 144, 164, 0.12);
    stroke: var(--edit);
    stroke-dasharray: 6 4;
  }
  body.mode-mj .zone-shape {
    stroke: rgba(201, 169, 97, 0.25);
  }
  body.mode-mj .zone-shape:hover,
  body.mode-edit .zone-shape:hover {
    fill: rgba(201, 169, 97, 0.18);
    stroke: var(--gold);
  }
  .zone-shape.sound-on {
    stroke: var(--gold);
    stroke-width: 3;
    animation: pulse-stroke 1.8s ease-in-out infinite;
  }
  @keyframes pulse-stroke {
    0%, 100% { stroke-opacity: 0.5; }
    50% { stroke-opacity: 1; }
  }
  .zone-label {
    position: absolute;
    transform: translate(-50%, -100%);
    background: var(--bg-void);
    color: var(--gold);
    font-size: 0.72rem;
    padding: 2px 7px;
    border-radius: 4px;
    border: 1px solid var(--gold-soft);
    pointer-events: none;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .15s;
  }
  body.mode-edit .zone-label { opacity: 1; }
  .zone-shape:hover + .zone-label { opacity: 1; }

  /* ---------- Inserts (cascade) ---------- */
  #insert-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .insert-card {
    position: absolute;
    pointer-events: auto;
    background: var(--panel);
    border: 1px solid var(--gold-soft);
    border-radius: 10px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    width: 78%;
    height: 78%;
    top: 11%;
    left: 11%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: insert-in .28s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes insert-in {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .insert-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: var(--bg-void);
    border-bottom: 1px solid var(--panel-edge);
    flex-shrink: 0;
  }
  .insert-head .name {
    font-size: 0.85rem;
    color: var(--gold);
  }
  .insert-head .close-btn {
    background: none;
    border: 1px solid var(--panel-edge);
    color: var(--ink-dim);
    border-radius: 6px;
    width: 26px;
    height: 26px;
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1;
  }
  .insert-head .close-btn:hover { color: var(--ink); border-color: var(--gold-soft); }
  .insert-body {
    flex: 1;
    position: relative;
    min-height: 0;
  }
  .insert-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 20px;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 14px),
      linear-gradient(160deg, #162026, #0d1216);
  }
  .insert-placeholder .icon { font-size: 2.2rem; opacity: 0.8; }
  .insert-placeholder .cap { color: var(--ink-dim); font-size: 0.8rem; max-width: 320px; }

  /* ---------- Portrait (visuel partagé : zones legacy + NPC) ---------- */
  @keyframes portrait-in {
    from { opacity: 0; transform: translate(-50%, 40px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }
  .portrait-visual {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .portrait-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 14px 28px rgba(0,0,0,0.65));
  }
  .portrait-placeholder {
    width: 100%;
    height: 75%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(160deg, #162026, #0d1216);
    border: 1px solid var(--gold-soft);
    border-radius: 10px;
  }
  .portrait-name {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10, 20, 24, 0.9);
    border: 1px solid var(--gold-soft);
    color: var(--gold);
    padding: 4px 16px;
    border-radius: 6px;
    font-size: 0.8rem;
    white-space: nowrap;
    z-index: 5;
  }

  .portrait-card {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 88%;
    pointer-events: auto;
    animation: portrait-in 0.25s ease-out;
  }
  .portrait-card .portrait-close {
    position: absolute;
    top: 0;
    right: 6px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--panel-edge);
    background: rgba(10, 20, 24, 0.85);
    color: var(--ink-dim);
    cursor: pointer;
    z-index: 5;
  }
  .portrait-card .portrait-close:hover { color: var(--ink); border-color: var(--gold-soft); }

  /* ---------- Effets météo ---------- */
  #weather-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 6;
    display: none;
  }
  #weather-fog {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 6;
    display: none;
  }
  #weather-fog .fog-base {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(255,255,255,0.24), rgba(255,255,255,0.05) 75%);
    mix-blend-mode: screen;
    animation: fog-base-pulse 15s ease-in-out infinite;
  }
  @keyframes fog-base-pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 0.85; }
  }
  #weather-fog .fog-texture {
    position: absolute;
    inset: -2% -2%;
    background-repeat: repeat;
    mix-blend-mode: screen;
    filter: blur(6px);
    will-change: background-position;
  }
  #weather-fog .ft1 {
    background-size: 640px 640px;
    opacity: 0.3;
    animation: fog-scroll-1 90s linear infinite;
  }
  #weather-fog .ft2 {
    background-size: 460px 460px;
    opacity: 0.2;
    animation: fog-scroll-2 130s linear infinite;
  }
  @keyframes fog-scroll-1 {
    from { background-position: 0px 0px; }
    to   { background-position: -640px -640px; }
  }
  @keyframes fog-scroll-2 {
    from { background-position: 0px 0px; }
    to   { background-position: 460px 460px; }
  }
  #weather-fog .fog-tint {
    position: absolute;
    inset: 0;
    background: rgba(150, 158, 168, 0.1);
  }

  /* ---------- Effets visuels de zone (lumière, fumée) ---------- */
  #effects-layer { position: absolute; inset: 0; pointer-events: none; }
  .insert-fx-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .fx { position: absolute; pointer-events: none; }
  .fx-light { mix-blend-mode: screen; }
  .fx-light .glow {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(var(--c), 0.95) 0%, rgba(var(--c), 0.5) 35%, rgba(var(--c), 0) 100%);
  }
  .fx-light .glow.beh-pulse { animation: fx-pulse 3.2s ease-in-out infinite; }
  .fx-light .glow.beh-defaillante { animation: fx-flicker 5.3s linear infinite; }
  .fx-light .glow.gyro-a { animation: fx-strobe-a 1.2s linear infinite; }
  .fx-light .glow.gyro-b { animation: fx-strobe-b 1.2s linear infinite; }
  @keyframes fx-pulse {
    0%, 100% { opacity: 0.6; transform: scale(0.92); }
    50% { opacity: 1; transform: scale(1.06); }
  }
  @keyframes fx-flicker {
    0% { opacity: 1; } 17% { opacity: 1; } 18% { opacity: 0.15; } 19% { opacity: 0.9; }
    20% { opacity: 0.1; } 21% { opacity: 1; } 58% { opacity: 1; } 59% { opacity: 0.25; }
    60% { opacity: 1; } 83% { opacity: 1; } 84% { opacity: 0.1; } 85% { opacity: 0.7; }
    86% { opacity: 0.05; } 87% { opacity: 0.9; } 88% { opacity: 1; } 100% { opacity: 1; }
  }
  @keyframes fx-strobe-a {
    0%, 15% { opacity: 1; } 16%, 30% { opacity: 0.05; } 31%, 45% { opacity: 1; } 46%, 100% { opacity: 0.05; }
  }
  @keyframes fx-strobe-b {
    0%, 50% { opacity: 0.05; } 51%, 65% { opacity: 1; } 66%, 80% { opacity: 0.05; } 81%, 95% { opacity: 1; } 96%, 100% { opacity: 0.05; }
  }
  /* fumée (particules sur canvas, même moteur que le feu) */
  .fx-smoke .smoke-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    -webkit-mask-image: linear-gradient(to top, #000 0%, #000 78%, transparent 100%);
    mask-image: linear-gradient(to top, #000 0%, #000 78%, transparent 100%);
  }
  /* feu (particules sur canvas + halo chaud en CSS) */
  .fx-fire { mix-blend-mode: screen; }
  .fx-fire .fire-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .fx-fire .fire-glow {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(var(--c), 0.55), rgba(var(--c), 0.18) 55%, rgba(var(--c), 0) 100%);
    animation: fx-fire-glow 1.4s ease-in-out infinite alternate;
  }
  @keyframes fx-fire-glow {
    from { opacity: calc(0.6 * var(--go, 1)); transform: scale(calc(0.94 * var(--g, 1))); }
    to { opacity: 1; transform: scale(calc(1.05 * var(--g, 1))); }
  }
  /* aura (contour de la zone) */
  .fx-aura { mix-blend-mode: screen; }
  .fx-aura svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .fx-aura .aura-glow.beh-pulse { animation: fx-aura-pulse 3.4s ease-in-out infinite; }
  .fx-aura .aura-run path { animation: fx-aura-run 6s linear infinite; }
  @keyframes fx-aura-pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  @keyframes fx-aura-run { to { stroke-dashoffset: -100; } }
  .zone-form input[type="color"], .zone-info-box input[type="color"] {
    width: 100%;
    height: 32px;
    padding: 2px;
    background: var(--bg-void);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    margin-bottom: 8px;
    cursor: pointer;
  }

  .zone-form input[type="number"], .zone-info-box input[type="number"] {
    width: 100%;
    background: var(--bg-void);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    padding: 7px 9px;
    border-radius: 6px;
    font-size: 0.85rem;
    margin-bottom: 8px;
  }
  #zone-clipboard-bar { padding: 0 14px 10px; }
  .zi-hint { font-size: 0.7rem; color: var(--ink-dim); margin: -2px 0 8px; }

  /* images "posées" : l'image s'affiche à la place et à la taille de la zone, sans cadre */
  #placed-layer { position: absolute; inset: 0; pointer-events: none; z-index: 14; }
  .insert-placed-layer { position: absolute; inset: 0; pointer-events: none; }
  .placed-img { position: absolute; pointer-events: none; }
  .placed-img img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.6));
  }
  /* une image posée déjà retournée cache son contour en MJ (il réapparaît au survol, pour la remasquer) */
  body.mode-mj .zone-shape.placed-on:not(:hover) { stroke: transparent; }
  .placed-img.preview { opacity: 0.6; }
  /* "Épouser la zone" : l'image est déformée en perspective sur les 4 coins de la zone.
     Le conteneur fait 768x512 unités (comme le dessin des zones) et suit la taille de l'écran. */
  .placed-warp { position: absolute; left: 0; top: 0; width: 768px; height: 512px; transform-origin: 0 0; pointer-events: none; }
  .placed-warp.preview { opacity: 0.6; }
  .placed-warp img { position: absolute; left: 0; top: 0; max-width: none; transform-origin: 0 0; display: block; }
  .placed-warp.reveal { animation: placed-fade 0.4s ease-out both; }
  @keyframes placed-fade { 0% { opacity: 0; } 100% { opacity: 1; } }
  .placed-img.clipped img { filter: none; }
  .placed-img img.reveal { animation: placed-in 0.45s ease-out both; }
  @keyframes placed-in {
    0% { opacity: 0; transform: perspective(700px) rotateY(88deg) scale(0.88); }
    60% { opacity: 1; }
    100% { opacity: 1; transform: perspective(700px) rotateY(0deg) scale(1); }
  }
  .insert-head .reset-placed {
    background: none;
    border: 1px solid var(--panel-edge);
    color: var(--ink-dim);
    border-radius: 6px;
    height: 26px;
    padding: 0 9px;
    margin-left: auto;
    margin-right: 8px;
    cursor: pointer;
    font-size: 0.78rem;
    white-space: nowrap;
  }
  .insert-head .reset-placed:hover { color: var(--ink); border-color: var(--gold-soft); }

  /* effets "devant les personnages" (masqués quand un insert est ouvert) */
  #effects-front-layer { position: absolute; inset: 0; pointer-events: none; z-index: 13; }
  /* un effet "en boucle" ne se clique pas en jeu : il ne doit jamais bloquer ce qui est dessous */
  body.mode-mj .zone-shape.fx-passive,
  body.mode-player .zone-shape.fx-passive { pointer-events: none; stroke: transparent; fill: transparent; }
  .zi-check { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--ink); margin: 2px 0 8px; cursor: pointer; }
  .zi-check input { accent-color: var(--gold); cursor: pointer; }
  /* brume au sol (particules sur canvas) : fondu sur les côtés et vers le haut */
  .fx-mist .mist-h {
    position: absolute; inset: 0;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 20%, #000 80%, transparent 100%);
    mask-image: linear-gradient(to right, transparent 0%, #000 20%, #000 80%, transparent 100%);
  }
  .fx-mist .mist-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    -webkit-mask-image: linear-gradient(to top, transparent 0%, #000 14%, #000 45%, transparent 100%);
    mask-image: linear-gradient(to top, transparent 0%, #000 14%, #000 45%, transparent 100%);
  }

  /* ---------- Orage (éclair) ---------- */
  #weather-storm {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 7;
    display: none;
  }
  #weather-storm .flash {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(222, 232, 255, 0.95), rgba(222, 232, 255, 0) 55%);
    opacity: 0;
  }

  /* ---------- Effets : focus, tension, tremblement, zoom ---------- */
  #scene-bg {
    transition: filter 0.4s ease;
  }
  #scene-bg.focus-blur {
    filter: blur(7px) brightness(0.72);
  }
  #tension-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 7;
    display: none;
    background: radial-gradient(ellipse at center, transparent 38%, rgba(120, 10, 10, 0.6) 100%);
    animation: tension-pulse 3.2s ease-in-out infinite;
  }
  @keyframes tension-pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 0.95; }
  }
  @keyframes screen-shake {
    0% { transform: translate(0, 0); }
    10% { transform: translate(-7px, 3px); }
    20% { transform: translate(6px, -5px); }
    30% { transform: translate(-5px, 5px); }
    40% { transform: translate(7px, -3px); }
    50% { transform: translate(-6px, 2px); }
    60% { transform: translate(5px, -4px); }
    70% { transform: translate(-3px, 3px); }
    80% { transform: translate(2px, -2px); }
    90% { transform: translate(-1px, 1px); }
    100% { transform: translate(0, 0); }
  }
  #stage.shaking { animation: screen-shake 0.6s ease-out; }
  @keyframes dramatic-zoom {
    0% { transform: scale(1); }
    40% { transform: scale(1.16); }
    100% { transform: scale(1); }
  }
  #stage.zooming { animation: dramatic-zoom 1.1s ease-in-out; }
  .effect-btn {
    display: block;
    width: 100%;
    background: none;
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    border-radius: 8px;
    padding: 7px 10px;

    }
    t.textContent = msg;
    t.style.borderColor = isError ? "var(--danger)" : "var(--gold-soft)";
    clearTimeout(t._timeout);
    t._timeout = setTimeout(() => { if (t.parentNode) t.remove(); }, 4000);
  }

  async function writeFileIntoDir(dirHandle, fileName, fileObj) {
    const fh = await dirHandle.getFileHandle(fileName, { create: true });
    const w = await fh.createWritable();
    await w.write(fileObj);
    await w.close();
  }

  async function writeJsonIntoDir(dirHandle, fileName, obj) {
    const fh = await dirHandle.getFileHandle(fileName, { create: true });
    const w = await fh.createWritable();
    await w.write(JSON.stringify(obj, null, 2));
    await w.close();
  }

  function cleanForSave(list) {
    return JSON.parse(JSON.stringify(list, (key, val) => (key && key.indexOf("_") === 0) ? undefined : val));
  }

  async function saveSceneToDisk() {
    if (!diskMode || !currentSceneDirHandle) return;
    try {
      const sceneData = {
        name: loadedSceneNames[currentSceneName] || currentSceneName,
        background: currentSceneMeta.background,
        music: currentSceneMeta.music,
        zones: cleanForSave(ZONES),
        activeNpcs: activeNpcOrder.slice(),
        weatherRain: weatherRain,
        weatherSnow: weatherSnow,
        weatherFog: weatherFog,
        weatherStorm: weatherStorm,
        tensionVignette: tensionVignette,
        rainIntensity: rainIntensity,
        snowIntensity: snowIntensity,
        musicVolume: musicVolume
      };
      await writeJsonIntoDir(currentSceneDirHandle, "scene.json", sceneData);
    } catch (e) {
      showToast("Échec de l'enregistrement sur disque.", true);
    }
  }

  async function hydrateAssetURLs(list, sceneDir) {
    for (const z of list) {
      if ((z.type === "image" || z.type === "personnage") && z.insert && z.insert.assetFile) {
        try {
          const inserts = await sceneDir.getDirectoryHandle("inserts");
          const fh = await inserts.getFileHandle(z.insert.assetFile);
          const file = await fh.getFile();
          z.insert._url = URL.createObjectURL(file);
        } catch (e) {}
      }
      if (z.type === "son" && z.assetFile) {
        try {
          const sons = await sceneDir.getDirectoryHandle("sons");
          const fh = await sons.getFileHandle(z.assetFile);
          const file = await fh.getFile();
          z._url = URL.createObjectURL(file);
        } catch (e) {}
      }
      if (z.insert && z.insert.nested) await hydrateAssetURLs(z.insert.nested, sceneDir);
    }
  }

  async function readScenesOrder() {
    try {
      const fh = await rootDirHandle.getFileHandle("scenes-order.json");
      const data = JSON.parse(await (await fh.getFile()).text());
      return Array.isArray(data.order) ? data.order : [];
    } catch (e) {
      return [];
    }
  }

  async function saveScenesOrder() {
    try {
      await writeJsonIntoDir(rootDirHandle, "scenes-order.json", { order: scenesList.slice() });
    } catch (e) {
      showToast("Impossible d'enregistrer l'ordre des scènes.", true);
    }
  }

  // Déplace une scène juste avant "beforeName" (ou tout à la fin si null)
  function moveScene(name, beforeName) {
    if (name === beforeName) return;
    const i = scenesList.indexOf(name);
    if (i < 0) return;
    scenesList.splice(i, 1);
    const j = beforeName ? scenesList.indexOf(beforeName) : -1;
    if (j >= 0) scenesList.splice(j, 0, name);
    else scenesList.push(name);
    saveScenesOrder();
    renderScenesMosaic();
  }

  async function scanScenes() {
    scenesList = [];
    try {
      for await (const [name, handle] of rootDirHandle.entries()) {
        if (handle.kind === "directory" && name !== "npc" && name !== "meteo" && name !== "vrac") {
          scenesList.push(name);
        }
      }
    } catch (e) {
      showToast("Impossible de lire ce dossier.", true);
      return;
    }
    // ordre choisi à la main (chronologie) ; les scènes pas encore classées
    // se placent à la suite, par ordre alphabétique "naturel" (2 avant 10)
    const savedOrder = await readScenesOrder();
    scenesList.sort((a, b) => {
      const ia = savedOrder.indexOf(a), ib = savedOrder.indexOf(b);
      if (ia >= 0 && ib >= 0) return ia - ib;
      if (ia >= 0) return -1;
      if (ib >= 0) return 1;
      return a.localeCompare(b, undefined, { numeric: true });
    });
    diskRootBtn.textContent = "📁 " + (rootDirHandle.name || "Dossier");
    if (scenesMosaicOpen) renderScenesMosaic();
  }

  // Ambiances météo automatiques (dossier "meteo" partagé — un son de
  // pluie et un son d'orage détectés par leur nom, joués automatiquement
  // quand on coche la case correspondante, sans rien à faire par scène)
  // ---------------------------------------------------------------

  async function scanMeteoFolder() {
    if (rainSoundURL) { URL.revokeObjectURL(rainSoundURL); rainSoundURL = null; }
    if (stormSoundURL) { URL.revokeObjectURL(stormSoundURL); stormSoundURL = null; }
    rainAmbienceEl.pause();
    stormAmbienceEl.pause();
    rainAmbienceEl.src = "";
    stormAmbienceEl.src = "";
    if (!rootDirHandle) return;
    try {
      meteoDirHandle = await rootDirHandle.getDirectoryHandle("meteo", { create: true });
      for await (const [name, handle] of meteoDirHandle.entries()) {
        if (handle.kind !== "file" || !/\.(mp3|wav|ogg|m4a)$/i.test(name)) continue;
        const lower = name.toLowerCase();
        const isStorm = /orage|storm|thunder|tonnerre/.test(lower);
        const isRain = /pluie|rain/.test(lower);
        if (isStorm && !stormSoundURL) {
          const file = await handle.getFile();
          stormSoundURL = URL.createObjectURL(file);
          stormAmbienceEl.src = stormSoundURL;
        } else if (isRain && !rainSoundURL) {
          const file = await handle.getFile();
          rainSoundURL = URL.createObjectURL(file);
          rainAmbienceEl.src = rainSoundURL;
        }
      }
    } catch (e) {
      // dossier "meteo" illisible : pas grave, on reste sans ambiance auto
    }
  }

  // Joue/coupe les ambiances pluie et orage selon l'état actuel — jamais
  // en vue Joueur, pour la même raison que la musique de scène (éviter le
  // double son si les deux fenêtres tournent sur la même machine).
  function updateWeatherAmbience() {
    const canPlay = state.mode !== "player";
    rainAmbienceEl.volume = musicVolume / 100;
    stormAmbienceEl.volume = musicVolume / 100;
    if (canPlay && weatherRain && rainSoundURL) {
      rainAmbienceEl.play().catch(() => {});
    } else {
      rainAmbienceEl.pause();
    }
    if (canPlay && weatherStorm && stormSoundURL) {
      stormAmbienceEl.play().catch(() => {});
    } else {
      stormAmbienceEl.pause();
    }
  }

  function deriveNpcName(fileName) {
    let base = fileName.replace(/\.[^.]+$/, "");
    let tokens = base.split(/[_\-\s]+/).filter(Boolean);
    tokens = tokens.filter(t => t.toLowerCase() !== "npc" && t.toLowerCase() !== "pnj");
    if (tokens.length === 0) tokens = [base];
    return tokens.map(t => t.charAt(0).toUpperCase() + t.slice(1)).join(" ");
  }

  async function scanNpcFolder() {
    npcList = [];
    // on vide le cache d'images pour forcer une relecture depuis le disque
    // (utile si un fichier a été remplacé en gardant le même nom)
    Object.keys(npcObjectURLs).forEach(fileName => {
      try { URL.revokeObjectURL(npcObjectURLs[fileName]); } catch (e) {}
      delete npcObjectURLs[fileName];
    });
    if (!rootDirHandle) { renderNpcChecklist(); return; }
    try {
      npcDirHandle = await rootDirHandle.getDirectoryHandle("npc", { create: true });
      for await (const [name, handle] of npcDirHandle.entries()) {
        if (handle.kind === "file" && /\.(png|jpe?g|webp|gif)$/i.test(name)) {
          npcList.push({ fileName: name, displayName: deriveNpcName(name) });
        }
      }
      npcList.sort((a, b) => a.displayName.localeCompare(b.displayName));
    } catch (e) {
      showToast('Impossible de lire le dossier "npc".', true);
    }
    renderNpcChecklist();
    if (activeNpcOrder.length) await hydrateActiveNpcImages();
  }

  function loadImageFromFile(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => resolve({ img, url });
      img.onerror = reject;
      img.src = url;
    });
  }

  function colorDistance(r1, g1, b1, r2, g2, b2) {
    const dr = r1 - r2, dg = g1 - g2, db = b1 - b2;
    return Math.sqrt(dr * dr + dg * dg + db * db);
  }

  function trimByBackgroundColor(canvas, data) {
    const w = canvas.width, h = canvas.height;
    const px = (x, y) => { const i = (y * w + x) * 4; return [data[i], data[i + 1], data[i + 2]]; };
    const corners = [px(0, 0), px(w - 1, 0), px(0, h - 1), px(w - 1, h - 1)];
    const bgR = (corners[0][0] + corners[1][0] + corners[2][0] + corners[3][0]) / 4;
    const bgG = (corners[0][1] + corners[1][1] + corners[2][1] + corners[3][1]) / 4;
    const bgB = (corners[0][2] + corners[1][2] + corners[2][2] + corners[3][2]) / 4;
    const tol = 26;
    const rowStep = w > 2000 ? 2 : 1;
    const colStep = h > 2000 ? 2 : 1;
    const rowIsBg = (y) => {
      let match = 0, total = 0;
      for (let x = 0; x < w; x += rowStep) {
        total++;
        const i = (y * w + x) * 4;
        if (colorDistance(data[i], data[i + 1], data[i + 2], bgR, bgG, bgB) < tol) match++;
      }
      return match / total > 0.92;
    };
    const colIsBg = (x) => {
      let match = 0, total = 0;
      for (let y = 0; y < h; y += colStep) {
        total++;
        const i = (y * w + x) * 4;
        if (colorDistance(data[i], data[i + 1], data[i + 2], bgR, bgG, bgB) < tol) match++;
      }
      return match / total > 0.92;
    };
    let top = 0, bottom = h - 1, left = 0, right = w - 1;
    while (top < bottom && rowIsBg(top)) top++;
    while (bottom > top && rowIsBg(bottom)) bottom--;
    while (left < right && colIsBg(left)) left++;
    while (right > left && colIsBg(right)) right--;
    return { minX: left, minY: top, maxX: right, maxY: bottom };
  }

  async function trimTransparentPadding(file) {
    try {
      const { img, url } = await loadImageFromFile(file);
      const canvas = document.createElement("canvas");
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      let data;
      try {
        data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      } catch (e) {
        return url; // lecture bloquée (rare en local) : on garde l'image telle quelle
      }

      // 1) essai par transparence (alpha)
      let minX = canvas.width, minY = canvas.height, maxX = -1, maxY = -1;
      const threshold = 10;
      const step = canvas.width * canvas.height > 4000000 ? 2 : 1;
      for (let y = 0; y < canvas.height; y += step) {
        for (let x = 0; x < canvas.width; x += step) {
          const alpha = data[(y * canvas.width + x) * 4 + 3];
          if (alpha > threshold) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      let bbox = null;
      if (maxX >= minX && maxY >= minY) {
        const aw = maxX - minX + 1, ah = maxY - minY + 1;
        if (!(aw >= canvas.width * 0.98 && ah >= canvas.height * 0.98)) {
          bbox = { minX, minY, maxX, maxY };
        }
      }

      // 2) sinon, essai par couleur de fond dominante sur les bords
      if (!bbox) {
        const cb = trimByBackgroundColor(canvas, data);
        const cw = cb.maxX - cb.minX + 1, ch = cb.maxY - cb.minY + 1;
        if (cb.maxX > cb.minX && cb.maxY > cb.minY && !(cw >= canvas.width * 0.97 && ch >= canvas.height * 0.97)) {
          bbox = cb;
        }
      }

      if (!bbox) return url; // rien d'utile à recadrer
      const w = bbox.maxX - bbox.minX + 1;
      const h = bbox.maxY - bbox.minY + 1;
      const outCanvas = document.createElement("canvas");
      outCanvas.width = w;
      outCanvas.height = h;
      outCanvas.getContext("2d").drawImage(canvas, bbox.minX, bbox.minY, w, h, 0, 0, w, h);
      URL.revokeObjectURL(url);
      return await new Promise((resolve) => {
        outCanvas.toBlob((blob) => resolve(blob ? URL.createObjectURL(blob) : url), "image/png");
      });
    } catch (e) {
      return URL.createObjectURL(file);
    }
  }

  async function ensureNpcObjectURL(fileName) {
    if (npcObjectURLs[fileName]) return npcObjectURLs[fileName];
    if (!npcDirHandle) return null;
    try {
      const fh = await npcDirHandle.getFileHandle(fileName);
      const file = await fh.getFile();
      const url = await trimTransparentPadding(file);
      npcObjectURLs[fileName] = url;
      renderNpcPortraits();
      return url;
    } catch (e) {
      return null;
    }
  }

  async function hydrateActiveNpcImages() {
    for (const fileName of activeNpcOrder) {
      if (!npcObjectURLs[fileName]) await ensureNpcObjectURL(fileName);
    }
    renderNpcPortraits();
  }

  function renderNpcChecklist() {
    const el = document.getElementById("npc-checklist");
    if (!diskMode) {
      el.innerHTML = '<span class="empty">Ouvre un dossier de scénario pour gérer les personnages.</span>';
      return;
    }
    if (!npcList.length) {
      el.innerHTML = '<span class="empty">Aucune image dans le dossier "npc". Ajoute des fichiers (ex. john_npc.jpg) puis actualise.</span>';
      return;
    }
    el.innerHTML = npcList.map(n => {
      const fname = escapeAttr(n.fileName);
      const checked = activeNpcOrder.includes(n.fileName) ? "checked" : "";
      const isSpeaking = speakingNpc === n.fileName;
      const extraBtns = activeNpcOrder.includes(n.fileName)
        ? '<button class="npc-speak-btn' + (isSpeaking ? " active" : "") + '" data-fname="' + fname + '" title="Définir comme locuteur">🗣️</button>' +
          '<button class="npc-emote-btn" data-fname="' + fname + '" title="Envoyer une émotion">😊</button>'
        : "";
      return '<div class="npc-row-wrap">' +
        '<label class="npc-row"><input type="checkbox" data-fname="' + fname + '" ' + checked + '><span>' + n.displayName + '</span></label>' +
        extraBtns +
      '</div>';
    }).join("");
    el.querySelectorAll("input[type=checkbox]").forEach(cb => {
      cb.addEventListener("change", () => toggleNpc(cb.dataset.fname, cb.checked));
    });
    el.querySelectorAll(".npc-speak-btn").forEach(btn => {
      btn.addEventListener("click", () => toggleSpeaker(btn.dataset.fname));
    });
    el.querySelectorAll(".npc-emote-btn").forEach(btn => {
      btn.addEventListener("click", (e) => { e.stopPropagation(); openEmotePicker(btn); });
    });
  }

  async function toggleNpc(fileName, isChecked) {
    if (isChecked) {
      if (!activeNpcOrder.includes(fileName)) {
        if (activeNpcOrder.length >= 4) {
          showToast("4 personnages maximum affichés en même temps.", true);
          renderNpcChecklist();
          return;
        }
        activeNpcOrder.push(fileName);
        await ensureNpcObjectURL(fileName);
      }
    } else {
      activeNpcOrder = activeNpcOrder.filter(f => f !== fileName);
      if (speakingNpc === fileName) speakingNpc = null;
      clearNpcEmote(fileName);
    }
    if (diskMode) saveSceneToDisk();
    broadcastState();
    renderNpcPortraits();
    renderNpcChecklist();
  }

  function toggleSpeaker(fileName) {
    speakingNpc = (speakingNpc === fileName) ? null : fileName;
    broadcastState();
    renderNpcPortraits();
    renderNpcChecklist();
  }

  function clearNpcEmote(fileName) {
    const e = npcEmotes[fileName];
    if (e && e.timeoutId) clearTimeout(e.timeoutId);
    delete npcEmotes[fileName];
  }

  function setNpcEmote(fileName, emoji, durationMs) {
    clearNpcEmote(fileName);
    const expiresAt = Date.now() + durationMs;
    const timeoutId = setTimeout(() => {
      delete npcEmotes[fileName];
      renderNpcPortraits();
    }, durationMs);
    npcEmotes[fileName] = { emoji, expiresAt, timeoutId };
  }

  function triggerEmote(fileName, emoji) {
    setNpcEmote(fileName, emoji, 4000);
    broadcastState();
    renderNpcPortraits();
  }

  // Applique les émotions reçues de l'autre fenêtre, avec une expiration
  // calée sur l'horodatage absolu (pas sur une durée fixe) pour rester
  // synchronisé même avec un peu de latence.
  function applyRemoteNpcEmotes(remoteEmotes) {
    Object.keys(npcEmotes).forEach(fname => {
      if (!remoteEmotes[fname]) clearNpcEmote(fname);
    });
    Object.entries(remoteEmotes).forEach(([fname, data]) => {
      const remaining = data.expiresAt - Date.now();
      if (remaining <= 0) { clearNpcEmote(fname); return; }
      const existing = npcEmotes[fname];
      if (existing && existing.expiresAt === data.expiresAt && existing.emoji === data.emoji) return;
      clearNpcEmote(fname);
      const timeoutId = setTimeout(() => {
        delete npcEmotes[fname];
        renderNpcPortraits();
      }, remaining);
      npcEmotes[fname] = { emoji: data.emoji, expiresAt: data.expiresAt, timeoutId };
    });
  }

  function openEmotePicker(btn) {
    const existing = document.querySelector(".emote-picker");
    if (existing) existing.remove();
    const picker = document.createElement("div");
    picker.className = "emote-picker";
    picker.innerHTML = EMOTE_CHOICES.map(e => '<button type="button">' + e + '</button>').join("");
    picker.querySelectorAll("button").forEach((b, i) => {
      b.addEventListener("click", (e) => {
        e.stopPropagation();
        triggerEmote(btn.dataset.fname, EMOTE_CHOICES[i]);
        picker.remove();
      });
    });
    btn.parentElement.appendChild(picker);
    setTimeout(() => {
      document.addEventListener("click", function closeOnce() {
        picker.remove();
        document.removeEventListener("click", closeOnce);
      }, { once: true });
    }, 0);
  }

  function renderNpcPortraits() {
    const layer = document.getElementById("npc-portrait-layer");
    layer.innerHTML = "";
    const active = activeNpcOrder.slice(0, 4);
    const hasSpeaker = speakingNpc && active.includes(speakingNpc);
    const others = hasSpeaker ? active.filter(f => f !== speakingNpc) : active;
    const ordered = hasSpeaker ? others.concat([speakingNpc]) : active; // le locuteur rendu en dernier (au-dessus)

    // Plafond de largeur (en plus de la hauteur) : filet de sécurité pour
    // qu'un détourage imparfait ou une pose très étalée ne fasse jamais
    // "manger" l'écran à un personnage au détriment des autres.
    const WIDTH_CAP_BY_COUNT = { 1: 40, 2: 30, 3: 24, 4: 24 };
    const baseCap = WIDTH_CAP_BY_COUNT[active.length] || 24;

    ordered.forEach((fileName) => {
      const isSpeaking = hasSpeaker && fileName === speakingNpc;
      let left, maxWidthPct;
      if (hasSpeaker) {
        left = isSpeaking ? "50%" : SPEAKER_SIDE_POSITIONS[others.indexOf(fileName)] || "50%";
        maxWidthPct = isSpeaking ? 44 : 22;
      } else {
        left = SLOT_POSITIONS[active.indexOf(fileName)] || "50%";
        maxWidthPct = baseCap;
      }
      const card = document.createElement("div");
      card.className = "npc-portrait" + (isSpeaking ? " speaking" : (hasSpeaker ? " dimmed" : ""));
      card.style.left = left;
      card.style.maxWidth = maxWidthPct + "%";
      const url = npcObjectURLs[fileName];
      const entry = npcList.find(n => n.fileName === fileName);
      const displayName = entry ? entry.displayName : fileName;
      const emote = npcEmotes[fileName];
      card.innerHTML =
        (emote ? '<div class="npc-emote-badge">' + emote.emoji + '</div>' : "") +
        (url ? '<img class="npc-portrait-img" src="' + url + '">' : '<div class="npc-portrait-placeholder"><div class="icon">🧍</div></div>') +
        '<div class="portrait-name">' + displayName + '</div>';
      layer.appendChild(card);
    });
  }

  document.getElementById("npc-refresh").addEventListener("click", scanNpcFolder);

  async function scanVracFolder() {

      vracAudio.sort((a, b) => a.localeCompare(b));

      const fh = await vracDirHandle.getFileHandle(fileName);

  // Petite galerie flottante : vignettes du dossier "vrac" pour choisir

    if (!dragDropActive()) return;
    e.preventDefault();
    dropHintEl.classList.remove("active");
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (!file) return;
    const isImage = /^image\//.test(file.type) || /\.(png|jpe?g|webp|gif)$/i.test(file.name);
    const isAudio = /^audio\//.test(file.type) || /\.(mp3|wav|ogg|m4a)$/i.test(file.name);
    if (!isImage && !isAudio) {
      showToast("Format non reconnu (image ou son attendu).", true);

    const ctx = zoneShapeAtPoint(e.clientX, e.clientY);
    if (ctx) {

          showToast("Cette zone n'accepte pas d'image (type \"" + ctx.zone.type + "\").", true);

  function resizeWeatherCanvas() {
    const stageEl = document.getElementById("stage");
    const rect = stageEl.getBoundingClientRect();
    weatherCanvas.width = Math.max(1, Math.round(rect.width));

  function initRainDrops() {
    const w = weatherCanvas.width, h = weatherCanvas.height;
    // t va de 0 (bruine, intensité 10) à 1 (torrentielle, intensité 100),
    // avec une courbe qui accélère vers le haut plutôt qu'une pente plate
    const t = Math.max(0, Math.min(1, (rainIntensity - 10) / 90));
    const factor = 0.22 + Math.pow(t, 1.3) * 3.6; // ~0.22x à ~3.8x la densité de référence
    const count = Math.max(8, Math.floor(((w * h) / 9000) * factor));
    const speedBoost = 1 + t * 1.1;
    const lenBoost = 1 + t * 0.7;
    rainDrops = [];
    for (let i = 0; i < count; i++) {
      rainDrops.push({
        x: Math.random() * w,
        y: Math.random() * h,
        len: (10 + Math.random() * 16) * lenBoost,
        speed: (5 + Math.random() * 6) * speedBoost,
        opacity: (0.12 + Math.random() * 0.28) * (0.85 + t * 0.4)
      });
    }
  }

  function initSnowFlakes() {
    const w = weatherCanvas.width, h = weatherCanvas.height;
    const t = Math.max(0, Math.min(1, (snowIntensity - 10) / 90));
    const factor = 0.22 + Math.pow(t, 1.3) * 3.4;
    const count = Math.max(8, Math.floor(((w * h) / 13000) * factor));
    snowFlakes = [];
    for (let i = 0; i < count; i++) {
      snowFlakes.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: 1.3 + Math.random() * 2.4,
        speed: (0.5 + Math.random() * 1.3) * (1 + t * 0.6),
        drift: 0.3 + Math.random() * 0.8,
        phase: Math.random() * Math.PI * 2,
        opacity: 0.35 + Math.random() * 0.45
      });
    }
  }

  function stepWeatherParticles() {
    const w = weatherCanvas.width, h = weatherCanvas.height;
    weatherCtx.clearRect(0, 0, w, h);

    if (weatherRain) {
      const t = Math.max(0, Math.min(1, (rainIntensity - 10) / 90));
      weatherCtx.strokeStyle = "rgba(200, 220, 255, 0.6)";
      weatherCtx.lineWidth = 1 + t * 0.8;
      const slant = 0.22;
      for (const d of rainDrops) {
        weatherCtx.globalAlpha = d.opacity;
        weatherCtx.beginPath();
        weatherCtx.moveTo(d.x, d.y);
        weatherCtx.lineTo(d.x - d.len * slant, d.y - d.len);
        weatherCtx.stroke();
        d.y += d.speed;
        d.x -= d.speed * slant * 0.5;
        if (d.y > h) { d.y = -10; d.x = Math.random() * w; }
        if (d.x < -20) d.x = w + 20;
      }
    }

    if (weatherSnow) {
      weatherCtx.fillStyle = "rgba(255, 255, 255, 1)";
      for (const f of snowFlakes) {
        weatherCtx.globalAlpha = f.opacity;
        weatherCtx.beginPath();
        weatherCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        weatherCtx.fill();
        f.y += f.speed;
        f.x += Math.sin((f.y + f.phase * 50) * 0.02) * f.drift * 0.6;
        if (f.y > h) { f.y = -6; f.x = Math.random() * w; }
        if (f.x < -10) f.x = w + 10;
        if (f.x > w + 10) f.x = -10;
      }
    }

    weatherCtx.globalAlpha = 1;
    weatherAnimId = requestAnimationFrame(stepWeatherParticles);
  }

  // Génère une texture de brouillard tuilable : des volutes irrégulières
  // (ellipses étirées, orientées et dosées au hasard), jamais des ronds
  // alignés en grille — dessinée une seule fois, pas recalculée en continu.
  function makeFogTexture(size, blobCount, alphaMin, alphaMax) {
    const canvas = document.createElement("canvas");
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext("2d");

    function drawBlobAt(cx, cy, rx, ry, rot, alpha) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);
      const maxR = Math.max(rx, ry);
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, maxR);
      grad.addColorStop(0, "rgba(255,255,255," + alpha + ")");
      grad.addColorStop(0.55, "rgba(255,255,255," + (alpha * 0.45) + ")");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (let i = 0; i < blobCount; i++) {
      const x = Math.random() * size;
      const y = Math.random() * size;
      const rx = size * (0.045 + Math.random() * 0.09);
      const ry = rx * (0.35 + Math.random() * 0.6); // étiré, pas rond
      const rot = Math.random() * Math.PI * 2;
      const alpha = alphaMin + Math.random() * (alphaMax - alphaMin);
      // on redessine chaque volute décalée d'une taille de tuile dans les
      // 8 directions voisines pour que le bord se raccorde sans couture
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          drawBlobAt(x + dx * size, y + dy * size, rx, ry, rot, alpha);
        }
      }
    }
    return canvas.toDataURL();
  }

  // Empreinte rapide d'un fichier audio : sa taille + 3 extraits (début,
  // milieu, fin). Sert à reconnaître "le même morceau" d'une scène à l'autre
  // même si chaque scène en garde sa propre copie sous le même nom.
  async function fingerprintFile(file) {
    try {
      const size = file.size;
      const chunk = 65536;
      const mid = Math.floor(size / 2);
      const parts = [
        file.slice(0, chunk),
        file.slice(Math.max(0, mid - chunk / 2), mid + chunk / 2),
        file.slice(Math.max(0, size - chunk))
      ];
      let h = 2166136261;
      for (const part of parts) {
        const bytes = new Uint8Array(await part.arrayBuffer());
        for (let i = 0; i < bytes.length; i++) {
          h ^= bytes[i];
          h = Math.imul(h, 16777619);
        }
      }
      return size + ":" + (h >>> 0).toString(16);
    } catch (e) {
      return null;
    }
  }

  async function loadSceneFromDisk(folderName) {
    let sceneDir;
    try {
      sceneDir = await rootDirHandle.getDirectoryHandle(folderName);
    } catch (e) {
      showToast("Dossier de scène introuvable.", true);
      return;
    }
    let sceneData;
    try {
      const jsonFh = await sceneDir.getFileHandle("scene.json");
      const jsonFile = await jsonFh.getFile();
      sceneData = JSON.parse(await jsonFile.text());
    } catch (e) {
      sceneData = { name: folderName, background: null, music: null, zones: [] };
    }

    if (bgObjectURL) URL.revokeObjectURL(bgObjectURL);
    bgObjectURL = null;
    if (sceneData.background) {
      try {
        const fh = await sceneDir.getFileHandle(sceneData.background);
        const file = await fh.getFile();
        bgObjectURL = URL.createObjectURL(file);
      } catch (e) {}
    }

    // Même musique que la scène précédente ? Alors on la laisse tourner,
    // sans la couper ni la relancer à zéro.
    let newMusicFile = null;
    if (sceneData.music) {
      try {
        const musiquesDir = await sceneDir.getDirectoryHandle("musiques");
        const fh = await musiquesDir.getFileHandle(sceneData.music);
        newMusicFile = await fh.getFile();
      } catch (e) {}
    }
    const newFingerprint = newMusicFile ? await fingerprintFile(newMusicFile) : null;
    const keepMusic = !!(newFingerprint && newFingerprint === currentMusicFingerprint && musicObjectURL);
    if (!keepMusic) {
      if (musicObjectURL) URL.revokeObjectURL(musicObjectURL);
      musicObjectURL = null;
      musicAudioEl.pause();
      if (newMusicFile) musicObjectURL = URL.createObjectURL(newMusicFile);
      musicAudioEl.src = musicObjectURL || "";
      currentMusicFingerprint = newFingerprint;
    }

    diskMode = true;
    currentSceneDirHandle = sceneDir;
    currentSceneName = folderName;
    currentSceneMeta = { background: sceneData.background, music: sceneData.music };
    loadedSceneNames[folderName] = sceneData.name || folderName;

    stopAllZoneSounds();
    ZONES.length = 0;
    (sceneData.zones || []).forEach(z => ZONES.push(z));
    await hydrateAssetURLs(ZONES, sceneDir);

    activeNpcOrder = Array.isArray(sceneData.activeNpcs) ? sceneData.activeNpcs.slice() : [];
    speakingNpc = null;
    Object.keys(npcEmotes).forEach(clearNpcEmote);

    if (typeof sceneData.weatherRain === "boolean" || typeof sceneData.weatherFog === "boolean") {
      weatherRain = !!sceneData.weatherRain;
      weatherSnow = !!sceneData.weatherSnow;
      weatherFog = !!sceneData.weatherFog;
      weatherStorm = !!sceneData.weatherStorm;
    } else {
      // ancien format (un seul effet à la fois) : on migre en douceur
      weatherRain = sceneData.weather === "rain";
      weatherSnow = false;
      weatherFog = sceneData.weather === "fog";
      weatherStorm = false;
    }
    weatherRainToggle.checked = weatherRain;
    weatherSnowToggle.checked = weatherSnow;
    weatherFogToggle.checked = weatherFog;
    weatherStormToggle.checked = weatherStorm;
    tensionVignette = !!sceneData.tensionVignette;
    tensionToggle.checked = tensionVignette;
    renderTensionVignette();
    rainIntensity = sceneData.rainIntensity || 50;
    rainIntensityInput.value = rainIntensity;
    snowIntensity = sceneData.snowIntensity || 50;
    snowIntensityInput.value = snowIntensity;
    musicVolume = (typeof sceneData.musicVolume === "number") ? sceneData.musicVolume : 70;
    musicVolumeInput.value = musicVolume;
    musicAudioEl.volume = musicVolume / 100;
    renderWeather();

    state.sceneId = folderName;
    state.insertStack = [];
    state.selectedZoneId = null;
    diskDeleteBtn.dataset.confirm = "";
    diskDeleteBtn.textContent = "🗑️ Supprimer la scène";
    updateDeleteBtnVisibility();

    if (state.mode !== "player") {
      // démarrage auto de l'ambiance au changement de scène, mais
      // uniquement côté MJ/édition — jamais côté vue Joueur, pour éviter
      // le double son si les deux fenêtres tournent sur la même machine
      state.audioEnabled = true;
      audioBtn.classList.add("on");
      audioBtn.textContent = "🔊 Son activé";
      stopAmbient();
      if (musicObjectURL) musicAudioEl.play().catch(() => {});
    } else if (state.audioEnabled) {
      stopAmbient();
      if (musicObjectURL) musicAudioEl.play().catch(() => {});
    }

    broadcastState();
    render();
    hydrateActiveNpcImages();
  }

  async function createSceneOnDisk(name, bgFile, musicFile) {
    const folderName = slugify(name) || ("scene-" + Date.now());
    const sceneDir = await rootDirHandle.getDirectoryHandle(folderName, { create: true });
    await sceneDir.getDirectoryHandle("inserts", { create: true });
    await sceneDir.getDirectoryHandle("sons", { create: true });
    await sceneDir.getDirectoryHandle("musiques", { create: true });

    const bgExt = (bgFile.name.split(".").pop() || "jpg").toLowerCase();
    const bgDestName = "background." + bgExt;
    await writeFileIntoDir(sceneDir, bgDestName, bgFile);

    let musicDestName = null;
    if (musicFile) {
      const musiquesDir = await sceneDir.getDirectoryHandle("musiques", { create: true });
      const mExt = (musicFile.name.split(".").pop() || "mp3").toLowerCase();
      musicDestName = "musique." + mExt;
      await writeFileIntoDir(musiquesDir, musicDestName, musicFile);
    }

    const sceneData = { name: name, background: bgDestName, music: musicDestName, zones: [], activeNpcs: [], weatherRain: false, weatherSnow: false, weatherFog: false, weatherStorm: false, tensionVignette: false, rainIntensity: 50, snowIntensity: 50, musicVolume: 70 };
    await writeJsonIntoDir(sceneDir, "scene.json", sceneData);
    return folderName;
  }

        '<div class="mosaic-label">' + (loadedSceneNames[name] || name) + '</div>';
      if (canReorder) {
        const isOrderDrag = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("application/x-scene-order");
        tile.draggable = true;
        tile.addEventListener("dragstart", (e) => {
          e.dataTransfer.setData("application/x-scene-order", name);
          e.dataTransfer.effectAllowed = "move";
          tile.classList.add("dragging");
        });
        tile.addEventListener("dragend", () => tile.classList.remove("dragging"));
        tile.addEventListener("dragover", (e) => {
          if (!isOrderDrag(e)) return;
          e.preventDefault();
          tile.classList.add("reorder-over");
        });
        tile.addEventListener("dragleave", () => tile.classList.remove("reorder-over"));
        tile.addEventListener("drop", (e) => {
          const dragged = e.dataTransfer.getData("application/x-scene-order");
          if (!dragged) return;
          e.preventDefault();
          tile.classList.remove("reorder-over");

  // Répond à une nouvelle fenêtre qui nous demande le dossier déjà

  window.addEventListener("message", (ev) => {
    if (!ev.data || ev.data.type !== "request-root-handle") return;
    if (!rootDirHandle || !ev.source) return;
    try {
      ev.source.postMessage({ type: "root-handle", rootDirHandle: rootDirHandle }, "*");

  // ---------------------------------------------------------------
  // Audio (Web Audio synthétisé — simule les 3 comportements sonores)
  // ---------------------------------------------------------------

  let actx = null;
  let ambientNode = null;
  let superposeNode = null;

  function ensureAudio() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    return actx;
  }

  function startAmbient(hue) {
    stopAmbient();
    const ctx = ensureAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = 90 + hue * 0.15;
    gain.gain.value = 0.04;
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    ambientNode = { osc, gain };
  }
  function stopAmbient() {
    if (ambientNode) { try { ambientNode.osc.stop(); } catch (e) {} ambientNode = null; }
  }
  function toggleSuperpose(on) {
    if (on) {
      const ctx = ensureAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "square";
      osc.frequency.value = 3.2; // rythme lent façon machine à laver
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.05;
      osc.connect(lfoGain).connect(ctx.destination);
      osc.start();
      superposeNode = { osc };
    } else if (superposeNode) {
      try { superposeNode.osc.stop(); } catch (e) {}
      superposeNode = null;
    }
  }
  function playSting() {
    const ctx = ensureAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(600, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
  }

  // ---------------------------------------------------------------
  // Résolution d'un chemin d'inserts (pour retrouver une zone imbriquée)
  // ---------------------------------------------------------------

  function findZoneAtLevel(stack) {
    // stack = liste d'ids de zones ouvertes, dans l'ordre. Renvoie la liste
    // de zones à afficher au niveau courant (racine si stack vide).
    let list = ZONES;
    let current = null;
    for (const id of stack) {
      current = list.find(z => z.id === id);
      if (!current || !current.insert || !current.insert.nested) return { list: [], current };
      list = current.insert.nested;
    }
    return { list, current };
  }

  function getZoneById(id, stack) {
    const { list } = findZoneAtLevel(stack.slice(0, -1));
    return list.find(z => z.id === id);
  }

  // Rendu
  // ---------------------------------------------------------------

  function render() {
    body.className = "mode-" + state.mode;
    sceneBg.src = diskMode ? (bgObjectURL || "") : window.__SCENE_IMG__;
    sceneBg.classList.toggle("focus-blur", state.insertStack.length > 0);

  function renderBaseZones() {
    svg.innerHTML = "";
    labelsLayer.innerHTML = "";
    if (state.insertStack.length > 0) return; // zones racine masquées si un insert est ouvert
    for (const zone of ZONES) {
      svg.appendChild(makeShape(zone, []));
      labelsLayer.appendChild(makeLabel(zone));
    }
  }

  function pointInPolygon(x, y, pointsStr) {
    const pts = pointsStr.trim().split(/\s+/).map(p => p.split(",").map(Number));
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }

  // En Édition, quand plusieurs zones se superposent à l'endroit cliqué, chaque
  // clic passe à la zone suivante en dessous (sinon la zone du dessus bloque
  // l'accès aux autres).
  function pickStackedZone(zone, list, svgEl, evt) {
    if (state.mode !== "edit" || !svgEl || !evt || typeof svgEl.createSVGPoint !== "function") return zone;
    const p = svgPointFromEvent(svgEl, evt);
    const stack = list.filter(z => pointInPolygon(p.x, p.y, z.points)).reverse(); // du dessus vers le dessous
    if (stack.length < 2) return zone;
    const i = stack.findIndex(z => z.id === state.selectedZoneId);
    const next = stack[(i + 1) % stack.length];
    showToast(stack.length + " zones superposées ici — sélection : « " + next.name + " » (" + (stack.indexOf(next) + 1) + "/" + stack.length + "). Reclique pour la suivante.");
    return next;
  }

  function makeShape(zone, parentStack) {
    const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    poly.setAttribute("points", zone.points);
    poly.classList.add("zone-shape");
    if (zone.type === "effet" && zone.effectMode !== "toggle") poly.classList.add("fx-passive");
    if (isPlacedZone(zone) && state.placedOn[zone.id]) poly.classList.add("placed-on");
    poly.dataset.zoneId = zone.id;
    if ((zone.type === "son" && zone.soundMode === "superpose" && state.soundOn[zone.id]) || (zone.type === "effet" && zone.effectMode === "toggle" && state.effectsOn[zone.id])) {
      poly.classList.add("sound-on");
    }
    poly.addEventListener("click", (e) => onZoneClick(pickStackedZone(zone, ZONES, svg, e), parentStack));
    return poly;
  }

  function centroid(pointsAttr) {
    const pts = pointsAttr.trim().split(/\s+/).map(p => p.split(",").map(Number));
    const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length;
    const cy = Math.min(...pts.map(p => p[1]));
    return { x: cx, y: cy };
  }

  function makeLabel(zone) {
    const div = document.createElement("div");
    div.className = "zone-label";
    div.textContent = (zone.icon ? zone.icon + " " : "") + zone.name;
    const c = centroid(zone.points);
    const stageBox = document.getElementById("stage").getBoundingClientRect();
    div.style.left = (c.x / 768 * 100) + "%";
    div.style.top = (c.y / 512 * 100) + "%";
    return div;
  }

  function renderInserts() {
    insertLayer.innerHTML = "";
    let depth = 0;
    let stack = [];
    for (const id of state.insertStack) {
      const { list } = findZoneAtLevel(stack);
      const zone = list.find(z => z.id === id);
      if (!zone) break;
      const cardEl = zone.type === "personnage" ? makePortraitCard(zone, depth, stack.slice()) : makeInsertCard(zone, depth, stack.slice());
      insertLayer.appendChild(cardEl);
      stack.push(id);
      depth++;
    }
    // zones imbriquées du niveau courant (à l'intérieur du dernier insert affiché)
    if (state.insertStack.length > 0) {
      const lastCard = insertLayer.lastElementChild;
      if (lastCard) {
        const svgWrap = lastCard.querySelector(".insert-zone-svg");
        const { list } = findZoneAtLevel(state.insertStack);
        if (svgWrap && list.length) {
          for (const zone of list) {
            const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            poly.setAttribute("points", zone.points);
            poly.classList.add("zone-shape");
            if (zone.type === "effet" && zone.effectMode !== "toggle") poly.classList.add("fx-passive");
            if (isPlacedZone(zone) && state.placedOn[zone.id]) poly.classList.add("placed-on");
            poly.dataset.zoneId = zone.id;
            if ((zone.type === "son" && zone.soundMode === "superpose" && state.soundOn[zone.id]) ||
                (zone.type === "effet" && zone.effectMode === "toggle" && state.effectsOn[zone.id])) {
              poly.classList.add("sound-on");
            }
            poly.addEventListener("click", (e) => {
              e.stopPropagation();
              onZoneClick(pickStackedZone(zone, list, svgWrap, e), state.insertStack.slice());
            });
            svgWrap.appendChild(poly);
          }
        }
      }
    }
  }

  function makePortraitCard(zone, depth, parentStack) {
    const card = document.createElement("div");
    card.className = "portrait-card";
    card.style.zIndex = 20 + depth;

    const closeBtn = document.createElement("button");
    closeBtn.className = "portrait-close";
    closeBtn.textContent = "✕";
    closeBtn.title = "Fermer";
    closeBtn.addEventListener("click", () => setInsertStack(parentStack));

    const visual = document.createElement("div");
    visual.className = "portrait-visual";
    if (zone.insert._url) {
      visual.innerHTML = '<img class="portrait-img" src="' + zone.insert._url + '">';
    } else {
      visual.innerHTML =
        '<div class="portrait-placeholder">' +
          '<div class="icon">' + (zone.insert.icon || "🧍") + '</div>' +
          '<div class="cap">' + zone.insert.caption + '</div>' +
        '</div>';
    }

    const nameTag = document.createElement("div");
    nameTag.className = "portrait-name";
    nameTag.textContent = zone.name;

    const zoneSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    zoneSvg.classList.add("zones", "insert-zone-svg");
    zoneSvg.setAttribute("viewBox", "0 0 768 512");
    zoneSvg.setAttribute("preserveAspectRatio", "none");
    zoneSvg.style.position = "absolute";
    zoneSvg.style.inset = "0";
    zoneSvg.style.width = "100%";
    zoneSvg.style.height = "100%";

    card.appendChild(visual);
    card.appendChild(nameTag);
    card.appendChild(closeBtn);
    card.appendChild(zoneSvg);
    return card;
  }

  function makeInsertCard(zone, depth, parentStack) {
    const card = document.createElement("div");
    card.className = "insert-card";
    const offset = depth * 4;
    card.style.top = (11 - offset) + "%";
    card.style.left = (11 + offset) + "%";
    card.style.width = (78 - offset * 1.4) + "%";
    card.style.height = (78 - offset * 1.4) + "%";
    card.style.zIndex = 10 + depth;

    const head = document.createElement("div");
    head.className = "insert-head";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = (zone.insert.icon || "") + " " + zone.insert.title;
    const closeBtn = document.createElement("button");
    closeBtn.className = "close-btn";
    closeBtn.textContent = "✕";
    closeBtn.title = "Fermer";
    closeBtn.addEventListener("click", () => {
      setInsertStack(parentStack);
    });
    head.appendChild(name);
    head.appendChild(closeBtn);

    const bodyWrap = document.createElement("div");
    bodyWrap.className = "insert-body";

    const placeholder = document.createElement("div");
    placeholder.className = "insert-placeholder";
    if (zone.insert._url) {
      placeholder.style.background = "#000";
      placeholder.innerHTML = '<img src="' + zone.insert._url + '" style="max-width:100%;max-height:100%;object-fit:contain;">';
    } else {
      placeholder.innerHTML =
        '<div class="icon">' + (zone.insert.icon || "🖼️") + '</div>' +
        '<div class="cap">' + zone.insert.caption + '</div>';
    }
    bodyWrap.appendChild(placeholder);

    // effets (lumière, fumée…) posés sur cette image
    const fxLayer = document.createElement("div");
    fxLayer.className = "insert-fx-layer";
    (zone.insert.nested || []).forEach(z => {
      if (z.type !== "effet") return;
      const el = createEffectElement(z);
      if (el) fxLayer.appendChild(el);
    });
    bodyWrap.appendChild(fxLayer);

    const zoneSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    zoneSvg.classList.add("zones", "insert-zone-svg");
    zoneSvg.setAttribute("viewBox", "0 0 768 512");
    zoneSvg.setAttribute("preserveAspectRatio", "none");
    zoneSvg.style.position = "absolute";
    zoneSvg.style.inset = "0";
    zoneSvg.style.width = "100%";
    zoneSvg.style.height = "100%";
    bodyWrap.appendChild(zoneSvg);

    // images posées sur cette image (cartes, indices...) : au-dessus des zones,
    // mais sans jamais bloquer leurs clics
    const nestedZones = zone.insert.nested || [];
    const placedLayer = document.createElement("div");
    placedLayer.className = "insert-placed-layer";
    fillPlacedLayer(placedLayer, nestedZones);
    bodyWrap.appendChild(placedLayer);

    if (state.mode === "mj" && nestedZones.some(isPlacedZone)) {
      const resetBtn = document.createElement("button");
      resetBtn.className = "reset-placed";
      resetBtn.textContent = "↺ Tout masquer";
      resetBtn.title = "Remettre toutes les images posées face cachée";
      resetBtn.addEventListener("click", () => resetPlacedIn(nestedZones));
      head.insertBefore(resetBtn, closeBtn);
    }

    card.appendChild(head);
    card.appendChild(bodyWrap);
    return card;
  }

  function renderBreadcrumb() {
    breadcrumbEl.innerHTML = "";
    const root = document.createElement("span");
    root.className = "crumb" + (state.insertStack.length === 0 ? " current" : "");
    root.textContent = diskMode ? (state.sceneId ? (loadedSceneNames[state.sceneId] || state.sceneId) : "Aucune scène chargée") : (SCENES[state.sceneId] ? SCENES[state.sceneId].name : "Aucune scène chargée");
    root.addEventListener("click", () => setInsertStack([]));
    breadcrumbEl.appendChild(root);

    let stack = [];
    for (let i = 0; i < state.insertStack.length; i++) {
      const id = state.insertStack[i];
      const { list } = findZoneAtLevel(stack);
      const zone = list.find(z => z.id === id);
      if (!zone) break;
      const sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = "›";
      breadcrumbEl.appendChild(sep);

      const crumb = document.createElement("span");
      crumb.className = "crumb" + (i === state.insertStack.length - 1 ? " current" : "");
      crumb.textContent = zone.name;
      const targetStack = state.insertStack.slice(0, i + 1);
      crumb.addEventListener("click", () => setInsertStack(targetStack));
      breadcrumbEl.appendChild(crumb);
      stack.push(id);
    }
  }

  function renderZoneInfo() {
    if (state.mode === "player") { zoneInfoEl.innerHTML = ""; return; }
    const zone = state.selectedZoneId ? findZoneAnywhere(state.selectedZoneId) : null;
    if (!zone) {
      zoneInfoEl.innerHTML = '<span class="empty">Clique une zone pour voir ses réglages.</span>';
      return;
    }
    if (state.mode === "edit") {
      renderZoneInfoEdit(zone);
    } else {
      renderZoneInfoReadOnly(zone);
    }
  }

  function renderZoneInfoReadOnly(zone) {
    const typeLabel = { image: "Image insérée", son: "Son / musique", scene: "Changement de scène", personnage: "Personnage", effet: "Effet visuel" }[zone.type] || zone.type;
    zoneInfoEl.innerHTML =
      row("Nom", zone.name) +
      row("Type", typeLabel) +
      (zone.type === "son" ? row("Mode", zone.soundMode === "unique" ? "Bruitage unique" : "Superposé (on/off)") : "") +
      (zone.type === "son" ? row("Volume", (typeof zone.volume === "number" ? zone.volume : 100) + " %") : "") +
      (zone.type === "image" ? row("Affichage", fxImageModeLabel(zone)) : "") +
      (zone.type === "effet" ? row("Effet", fxKindLabel(zone.effectKind)) + (fxHasIntensity(zone.effectKind) ? row(fxIntensityWord(zone.effectKind), Math.round(fireIntensity(zone) * 100) + " / 100") : "") + (zone.effectFront ? row("Position", "Devant les personnages") : "") + row("Activation", zone.effectMode === "toggle" ? "Au clic" : "En boucle") : "") +
      (zone.type === "scene" ? row("Cible", diskMode ? (loadedSceneNames[zone.target] || zone.target) : (SCENES[zone.target] ? SCENES[zone.target].name : zone.target)) : "");
  }

  function escapeAttr(str) {
    return (str || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  }

    stopZoneTest();
    const typeLabel = { image: "Image insérée", son: "Son / musique", scene: "Changement de scène", personnage: "Personnage", effet: "Effet visuel" }[zone.type] || zone.type;
    zoneInfoEl.innerHTML =
      '<label class="zi-label">Nom</label>' +
      '<input type="text" id="zi-name" value="' + escapeAttr(zone.name) + '">' +
      row("Type", typeLabel) +
      (zone.type === "son" ?
        '<label class="zi-label">Mode sonore</label>' +
        '<select id="zi-sound-mode">' +
          '<option value="superpose"' + (zone.soundMode !== "unique" ? " selected" : "") + '>Superposé (on/off)</option>' +
          '<option value="unique"' + (zone.soundMode === "unique" ? " selected" : "") + '>Bruitage unique</option>' +
        '</select>'
        : "") +
      soundVolumeEditHtml(zone) +
      effectEditHtml(zone) +
      imageModeEditHtml(zone) +
      '<div class="zi-actions">' +
        (diskMode && (zone.type === "image" || zone.type === "personnage") ?
          '<button id="zi-assoc-image">' + ((zone.insert && zone.insert.assetFile) ? "Changer l'image (" + zone.insert.assetFile + ")" : "Associer une image") + '</button>'
          : "") +

          '<button id="zi-assoc-sound">' + (zone.assetFile ? "Changer le son (" + zone.assetFile + ")" : "Associer un son") + '</button>'
          : "") +
        '<button id="zi-copy">📋 Copier la zone</button>' +
        '<button id="zi-redraw">Redessiner la forme</button>' +

      '</div>';

    const nameInput = zoneInfoEl.querySelector("#zi-name");
    function commitName() {
      const val = nameInput.value.trim();
      if (val && val !== zone.name) {
        zone.name = val;

        renderInserts();
        renderBreadcrumb();
        if (diskMode) saveSceneToDisk();
      }

    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { commitName(); nameInput.blur(); }

    bindEffectEdit(zone);
    bindImageModeEdit(zone);
    bindSoundVolumeEdit(zone);
    zoneInfoEl.querySelector("#zi-copy").addEventListener("click", () => copyZone(zone));

    const assocImgBtn = zoneInfoEl.querySelector("#zi-assoc-image");

    zoneInfoEl.querySelector("#zi-delete").addEventListener("click", (e) => {

      if (!btn.dataset.confirm) {

        btn.dataset.timeout = setTimeout(() => {
          btn.dataset.confirm = "";
          btn.textContent = "Supprimer la zone";
        }, 4000);
      } else {
