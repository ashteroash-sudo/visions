        saveTimer = setTimeout(() => { if (diskMode) saveSceneToDisk(); }, 400);
      });
    }
  }

  // ---------------------------------------------------------------
  // Images "posées" : une zone image en mode "Posée sur la scène" ne s'ouvre pas
  // en grande fenêtre. Au clic, son image apparaît directement à la place et à
  // la taille de la zone, sans cadre ; plusieurs peuvent être visibles en même
  // temps (cartes de tarot, indices épinglés sur un tableau...).
  // ---------------------------------------------------------------

  const PLACED_REVEAL_MS = 450;
  const placedRevealAt = {};

  function isPlacedZone(z) { return z.type === "image" && z.insertMode === "surplace"; }

  // ----- "Épouser la zone" : déformation en perspective sur un quadrilatère -----

  // Renvoie les 4 coins dans l'ordre [haut-gauche, haut-droite, bas-droite, bas-gauche]
  // (sens horaire), décalés de "turn" quarts de tour ; null si la zone n'est pas un
  // quadrilatère convexe.
  function orderedQuad(pointsStr, turn) {
    const pts = pointsStr.trim().split(/\s+/).map(q => q.split(",").map(Number));
    if (pts.length !== 4 || pts.some(q => q.length < 2 || !isFinite(q[0]) || !isFinite(q[1]))) return null;
    const cx = pts.reduce((a, q) => a + q[0], 0) / 4, cy = pts.reduce((a, q) => a + q[1], 0) / 4;
    pts.sort((a, b) => Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx)); // sens horaire à l'écran
    let sign = 0;
    for (let i = 0; i < 4; i++) {
      const a = pts[i], b = pts[(i + 1) % 4], c = pts[(i + 2) % 4];
      const cr = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
      if (Math.abs(cr) < 1e-6) return null;
      if (sign === 0) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null; // coin rentrant
    }
    let tl = 0;
    for (let i = 1; i < 4; i++) if (pts[i][0] + pts[i][1] < pts[tl][0] + pts[tl][1]) tl = i;
    const k = ((tl + (turn || 0)) % 4 + 4) % 4;
    return [pts[k], pts[(k + 1) % 4], pts[(k + 2) % 4], pts[(k + 3) % 4]];
  }

  function canWarpZone(zone) { return !!orderedQuad(zone.points, 0); }
  function isWarpZone(zone) { return !!zone.placedWarp && canWarpZone(zone); }

  // matrix3d CSS qui envoie le rectangle (0,0)-(w,h) sur le quadrilatère q (4 coins)
  function warpMatrix3d(q, w, h) {
    const x0 = q[0][0], y0 = q[0][1], x1 = q[1][0], y1 = q[1][1], x2 = q[2][0], y2 = q[2][1], x3 = q[3][0], y3 = q[3][1];
    const dx1 = x1 - x2, dx2 = x3 - x2, dx3 = x0 - x1 + x2 - x3;
    const dy1 = y1 - y2, dy2 = y3 - y2, dy3 = y0 - y1 + y2 - y3;
    let a, b, c, d, e, f, g, hh;
    if (Math.abs(dx3) < 1e-9 && Math.abs(dy3) < 1e-9) {
      a = x1 - x0; b = x3 - x0; c = x0; d = y1 - y0; e = y3 - y0; f = y0; g = 0; hh = 0;
    } else {
      const det = dx1 * dy2 - dx2 * dy1;
      g = (dx3 * dy2 - dx2 * dy3) / det;
      hh = (dx1 * dy3 - dx3 * dy1) / det;
      a = x1 - x0 + g * x1; b = x3 - x0 + hh * x3; c = x0;
      d = y1 - y0 + g * y1; e = y3 - y0 + hh * y3; f = y0;
    }
    // carré unité -> quad ; on compose avec la mise à l'échelle px image -> carré unité
    const m = [a / w, d / w, 0, g / w, b / h, e / h, 0, hh / h, 0, 0, 1, 0, c, f, 0, 1];
    return "matrix3d(" + m.join(",") + ")";
  }

  // le conteneur 768x512 suit la taille réelle de son calque (même étirement que les zones)
  const warpObserver = (typeof ResizeObserver !== "undefined") ? new ResizeObserver(entries => {
    entries.forEach(en => syncWarpScale(en.target));
  }) : null;
  function syncWarpScale(layer) {
    const w = layer.clientWidth, h = layer.clientHeight;
    if (!w || !h) return;
    layer.querySelectorAll(":scope > .placed-warp").forEach(el => {
      el.style.transform = "scale(" + (w / 768) + "," + (h / 512) + ")";
    });
  }

  function createWarpElement(zone, url) {
    const q = orderedQuad(zone.points, zone.placedTurn || 0);
    const el = document.createElement("div");
    el.className = "placed-warp" + (state.mode === "edit" ? " preview" : "");
    const img = document.createElement("img");
    img.draggable = false;
    img.style.visibility = "hidden";
    const place = () => {
      const w = img.naturalWidth || 1, h = img.naturalHeight || 1;
      img.style.width = w + "px";
      img.style.height = h + "px";
      img.style.transform = warpMatrix3d(q, w, h);
      img.style.visibility = "";
    };
    img.onload = place;
    img.src = url;
    if (img.complete && img.naturalWidth) place();
    const age = performance.now() - (placedRevealAt[zone.id] || 0);
    if (state.mode !== "edit" && age < PLACED_REVEAL_MS) {
      el.classList.add("reveal");
      el.style.animationDelay = (-age) + "ms";
    }
    el.appendChild(img);
    return el;
  }

  function createPlacedElement(zone) {
    const url = zone.insert && zone.insert._url;
    if (!url) return null;
    if (state.mode !== "edit" && !state.placedOn[zone.id]) return null;
    if (isWarpZone(zone)) return createWarpElement(zone, url);
    const b = zoneBBox(zone.points);
    const el = document.createElement("div");
    el.className = "placed-img" + (state.mode === "edit" ? " preview" : "") + (zone.placedClip ? " clipped" : "");
    el.style.left = (b.minX / 768 * 100) + "%";
    el.style.top = (b.minY / 512 * 100) + "%";
    el.style.width = ((b.maxX - b.minX) / 768 * 100) + "%";
    el.style.height = ((b.maxY - b.minY) / 512 * 100) + "%";
    if (typeof zone.placedRotation === "number" && zone.placedRotation) el.style.transform = "rotate(" + zone.placedRotation + "deg)";
    const img = document.createElement("img");
    img.src = url;
    img.draggable = false;
    img.style.objectFit = zone.placedFit === "cover" ? "cover" : "contain";
    if (zone.placedClip) {
      // découpe l'image selon la forme exacte de la zone (triangle, polygone...)
      const bw = (b.maxX - b.minX) || 1, bh = (b.maxY - b.minY) || 1;
      const pts = zone.points.trim().split(/\s+/).map(q => q.split(",").map(Number));
      el.style.clipPath = "polygon(" + pts.map(q => (((q[0] - b.minX) / bw) * 100).toFixed(2) + "% " + (((q[1] - b.minY) / bh) * 100).toFixed(2) + "%").join(",") + ")";
    }
    // l'animation de retournement ne se joue qu'à l'apparition (les affichages se
    // reconstruisent souvent : on la reprend à la bonne phase, sans la rejouer)
    const age = performance.now() - (placedRevealAt[zone.id] || 0);
    if (state.mode !== "edit" && age < PLACED_REVEAL_MS) {
      img.className = "reveal";
      img.style.animationDelay = (-age) + "ms";
    }
    el.appendChild(img);
    return el;
  }

  function fillPlacedLayer(layer, zones) {
    zones.forEach(z => {
      if (!isPlacedZone(z)) return;
      const el = createPlacedElement(z);
      if (!el) return;
      layer.appendChild(el);
      if (el.classList.contains("placed-warp")) {
        syncWarpScale(layer);
        if (warpObserver) warpObserver.observe(layer);
      }
    });
  }

  function renderPlaced() {
    const layer = document.getElementById("placed-layer");
    if (!layer) return;
    layer.innerHTML = "";
    layer.style.display = state.insertStack.length > 0 ? "none" : "";
    fillPlacedLayer(layer, ZONES);
  }

  function resetPlacedIn(zones) {
    const next = { ...state.placedOn };
    zones.forEach(z => { if (isPlacedZone(z)) delete next[z.id]; });
    state.placedOn = next;
    broadcastState();
    render();
  }

  // ---------------------------------------------------------------
  // Copier / coller une zone (même d'une scène à l'autre), avec ses
  // fichiers associés et les zones qu'elle contient.
  // ---------------------------------------------------------------

  let zoneClipboard = null; // { zone, assets: { idOrigine: { kind, file } }, fromScene, fromLevel }

  async function collectZoneAssets(zone, assets) {
    try {
      if ((zone.type === "image" || zone.type === "personnage") && zone.insert && zone.insert.assetFile) {
        const dir = await currentSceneDirHandle.getDirectoryHandle("inserts");
        assets[zone.id] = { kind: "image", file: await (await dir.getFileHandle(zone.insert.assetFile)).getFile() };
      } else if (zone.type === "son" && zone.assetFile) {
        const dir = await currentSceneDirHandle.getDirectoryHandle("sons");
        assets[zone.id] = { kind: "sound", file: await (await dir.getFileHandle(zone.assetFile)).getFile() };
      }
    } catch (e) {}
    if (zone.insert && Array.isArray(zone.insert.nested)) {
      for (const z of zone.insert.nested) await collectZoneAssets(z, assets);
    }
  }

  async function copyZone(zone) {
    const assets = {};
    if (diskMode && currentSceneDirHandle) await collectZoneAssets(zone, assets);
    const ctx = findZoneContext(zone.id);
    zoneClipboard = {
      zone: cleanForSave([zone])[0],
      assets: assets,
      fromScene: currentSceneName,
      fromLevel: JSON.stringify(ctx ? ctx.parentStack : [])
    };
    showToast("Zone \"" + zone.name + "\" copiée.");
    updateClipboardBar();
  }

  function offsetPoints(pointsStr, dx, dy) {
    return pointsStr.trim().split(/\s+/).map(p => {
      const xy = p.split(",").map(Number);
      return Math.min(768, Math.max(0, xy[0] + dx)).toFixed(1) + "," + Math.min(512, Math.max(0, xy[1] + dy)).toFixed(1);
    }).join(" ");
  }

  function cloneZoneWithNewIds(zone, idMap) {
    const clone = JSON.parse(JSON.stringify(zone));
    const walk = (z) => {
      const oldId = z.id;
      z.id = slugify(z.name) + "-" + Math.random().toString(36).slice(2, 6);
      idMap[oldId] = z;
      if (z.insert && Array.isArray(z.insert.nested)) z.insert.nested.forEach(walk);
    };
    walk(clone);
    return clone;
  }

  async function pasteZone() {
    if (!zoneClipboard) { showToast("Rien à coller — copie d'abord une zone.", true); return; }
    if (!diskMode || !currentSceneDirHandle) { showToast("Charge une scène pour y coller la zone.", true); return; }
    const parentStack = state.insertStack.slice();
    const src = zoneClipboard.zone;
    const list = getInsertionList(parentStack);
    if (!list) return;

    const idMap = {};
    const zone = cloneZoneWithNewIds(src, idMap);
    // même scène, même niveau : on décale un peu pour que la copie se voie
    if (zoneClipboard.fromScene === currentSceneName && zoneClipboard.fromLevel === JSON.stringify(parentStack)) {
      zone.points = offsetPoints(zone.points, 18, 18);
    }
    // on oublie les références de fichiers, puis on réécrit ceux qu'on a pu lire
    Object.keys(idMap).forEach(oldId => {
      const z = idMap[oldId];
      if (z.insert) delete z.insert.assetFile;
      delete z.assetFile;
    });
    list.push(zone);
    for (const oldId of Object.keys(zoneClipboard.assets)) {
      const a = zoneClipboard.assets[oldId];
      const z = idMap[oldId];
      if (!z) continue;
      try {
        if (a.kind === "image") await attachImageToZone(z, a.file, true);
        else await attachSoundToZone(z, a.file, true);
      } catch (e) {}
    }
    state.selectedZoneId = zone.id;
    await saveSceneToDisk();
    render();
    showToast("Zone \"" + zone.name + "\" collée.");
  }

  function updateClipboardBar() {
    const bar = document.getElementById("zone-clipboard-bar");
    if (!bar) return;
    if (state.mode !== "edit" || !zoneClipboard || !currentSceneDirHandle) {
      bar.style.display = "none";
      bar.innerHTML = "";
      return;
    }
    bar.style.display = "block";
    bar.innerHTML = "";
    const btn = document.createElement("button");
    btn.className = "effect-btn";
    btn.id = "zc-paste";
    btn.textContent = "📋 Coller « " + zoneClipboard.zone.name + " »";
    btn.addEventListener("click", () => pasteZone());
    bar.appendChild(btn);
  }

  document.addEventListener("keydown", (e) => {
    if (state.mode !== "edit" || drawing) return;
    if (!(e.ctrlKey || e.metaKey)) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || "")) return;
    if (e.key === "c" && state.selectedZoneId) {
      if (window.getSelection && String(window.getSelection())) return;
      const z = findZoneAnywhere(state.selectedZoneId);
      if (z) { e.preventDefault(); copyZone(z); }
    } else if (e.key === "v" && zoneClipboard) {
      e.preventDefault();
      pasteZone();
    }
  });

  function iconForType(type, soundMode) {
    if (type === "image") return "🔍";
    if (type === "personnage") return "🧍";
    if (type === "scene") return "🚪";
    if (type === "effet") return "✨";
    if (type === "son") return soundMode === "unique" ? "🎵" : "🔊";
    return "❔";
  }

  function slugify(str) {
    return (str || "").toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "zone";
  }

  function getActiveDrawingSvg() {
    if (state.insertStack.length === 0) return svg;
    const cards = insertLayer.querySelectorAll(".insert-card");
    if (!cards.length) return null;
    return cards[cards.length - 1].querySelector(".insert-zone-svg");
  }

  function getInsertionList(stack) {
    if (stack.length === 0) return ZONES;
    let list = ZONES;
    let current = null;
    for (const id of stack) {
      current = list.find(z => z.id === id);
      if (!current) return null;
      if (!current.insert) current.insert = { title: current.name, caption: "", icon: current.icon };
      if (!current.insert.nested) current.insert.nested = [];
      list = current.insert.nested;
    }
    return list;
  }

  function svgPointFromEvent(svgEl, evt) {
    const pt = svgEl.createSVGPoint();
    pt.x = evt.clientX;
    pt.y = evt.clientY;
    const ctm = svgEl.getScreenCTM();
    if (!ctm) return { x: 0, y: 0 };
    const p = pt.matrixTransform(ctm.inverse());
    return { x: p.x, y: p.y };
  }

  const drawToggleBtn = document.getElementById("draw-toggle");
  drawToggleBtn.addEventListener("click", () => {
    if (drawing) { cancelDrawing(); return; }
    startDrawing();
  });

  function startDrawing() {
    const target = getActiveDrawingSvg();
    if (!target) return;
    body.classList.add("drawing-mode");
    drawToggleBtn.classList.add("on");
    drawToggleBtn.textContent = "✕ Annuler le dessin";

    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.classList.add("draw-temp");

    const capture = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    capture.setAttribute("x", "0"); capture.setAttribute("y", "0");
    capture.setAttribute("width", "768"); capture.setAttribute("height", "512");
    capture.classList.add("draw-capture");
    g.appendChild(capture);

    const previewLine = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    previewLine.classList.add("draw-preview-line");
    g.appendChild(previewLine);

    target.appendChild(g);

    drawing = { svg: target, points: [], g, capture, previewLine, vertices: [] };

    const bar = document.createElement("div");
    bar.className = "draw-hint-bar";
    bar.id = "draw-hint-bar";
    bar.textContent = "Clique pour poser des points (min. 3) • Entrée pour terminer • Échap pour annuler";
    document.getElementById("stage").appendChild(bar);

    capture.addEventListener("click", onDrawClick);
    document.addEventListener("keydown", onDrawKeydown);
  }

  function onDrawClick(evt) {
    if (!drawing) return;
    const p = svgPointFromEvent(drawing.svg, evt);
    drawing.points.push(p);

    const vertex = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    vertex.classList.add("draw-vertex");
    vertex.setAttribute("cx", p.x);
    vertex.setAttribute("cy", p.y);
    vertex.setAttribute("r", "5");
    drawing.g.appendChild(vertex);
    drawing.vertices.push(vertex);

    updateDrawPreview();
  }

  function updateDrawPreview() {
    const pts = drawing.points.map(p => p.x + "," + p.y).join(" ");
    drawing.previewLine.setAttribute("points", pts);
  }

  function onDrawKeydown(evt) {
    if (evt.key === "Escape") { cancelDrawing(); }
    else if (evt.key === "Enter") { finishDrawing(); }
    else if (evt.key === "Backspace" && drawing && drawing.points.length) {
      drawing.points.pop();
      const v = drawing.vertices.pop();
      if (v) v.remove();
      updateDrawPreview();
    }
  }

  function teardownDrawingVisuals() {
    if (!drawing) return;
    drawing.capture.removeEventListener("click", onDrawClick);
    document.removeEventListener("keydown", onDrawKeydown);
    if (drawing.g.parentNode) drawing.g.remove();
    const bar = document.getElementById("draw-hint-bar");
    if (bar) bar.remove();
    body.classList.remove("drawing-mode");
    drawToggleBtn.classList.remove("on");
    drawToggleBtn.textContent = "✏️ Créer une zone";
  }

  function cancelDrawing() {
    if (!drawing) return;
    teardownDrawingVisuals();
    drawing = null;
  }

  function finishDrawing() {
    if (!drawing || drawing.points.length < 3) return;
    const pointsStr = drawing.points.map(p => p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
    const replaceId = drawing.replaceZoneId;
    const parentStack = state.insertStack.slice();
    teardownDrawingVisuals();
    drawing = null;
    if (replaceId) {
      const ctx = findZoneContext(replaceId);
      if (ctx) ctx.zone.points = pointsStr;
      if (diskMode) saveSceneToDisk();
      render();
    } else {
      openZoneForm(pointsStr, parentStack);
    }
  }

  function openZoneForm(pointsStr, parentStack) {
    const overlay = document.createElement("div");
    overlay.className = "zone-form-overlay";
    overlay.innerHTML =
      '<div class="zone-form">' +
        '<h4>Nouvelle zone</h4>' +
        '<label>Nom de la zone</label>' +
        '<input type="text" id="zf-name" placeholder="Ex. Tiroir du bas">' +
        '<label>Comportement</label>' +
        '<select id="zf-type">' +
          '<option value="image">Image insérée</option>' +
          '<option value="son">Son / musique</option>' +
          '<option value="scene">Changement de scène</option>' +
          '<option value="effet">Effet visuel (lumière, fumée…)</option>' +
        '</select>' +
        '<div id="zf-img-wrap">' +
          '<label>Affichage</label>' +
          '<select id="zf-img-mode"><option value="perma">Reste ouvert (recherche, image dans image)</option><option value="ephemere">Éphémère (disparaît tout seul)</option><option value="surplace">Posée sur la scène (à la taille de la zone)</option></select>' +
          '<div id="zf-img-duration-wrap" style="display:none"><label>Durée (secondes)</label><input type="number" id="zf-img-duration" min="1" max="60" value="5"></div>' +
        '</div>' +
        '<div id="zf-son-mode-wrap">' +
          '<label>Mode sonore</label>' +
          '<select id="zf-son-mode">' +
            '<option value="superpose">Superposé (on/off)</option>' +
            '<option value="unique">Bruitage unique</option>' +
          '</select>' +
        '</div>' +
        '<div id="zf-scene-target-wrap" style="display:none">' +
          '<label>Scène cible</label>' +
          '<select id="zf-scene-target"></select>' +
        '</div>' +
        '<div id="zf-fx-wrap" style="display:none">' +
          '<label>Effet</label>' +
          '<select id="zf-fx-kind">' + fxKindOptionsHtml("lumiere") + '</select>' +
          '<div id="zf-fx-behavior-wrap">' +
            '<label>Comportement</label>' +
            '<select id="zf-fx-behavior">' + fxBehaviorOptionsHtml("lumiere", "fixe") + '</select>' +
          '</div>' +
          '<label>Couleur</label>' +
          '<input type="color" id="zf-fx-color" value="#ffd27a">' +
          '<div id="zf-fx-intensity-wrap" style="display:none"><label><span id="zf-fx-int-name">Intensité</span> : <span id="zf-fx-int-val">35</span> / 100</label>' +
            '<input type="range" id="zf-fx-intensity" class="weather-slider" min="0" max="100" step="1" value="35">' +
            '<div class="note" id="zf-fx-int-hint">bougie ← feu de cheminée → brasier</div></div>' +
          '<div id="zf-fx-color2-wrap" style="display:none"><label>Seconde couleur</label><input type="color" id="zf-fx-color2" value="#2a5bff"></div>' +
          '<label>Activation</label>' +
          '<select id="zf-fx-mode"><option value="loop">En boucle dès l\'arrivée sur la scène</option><option value="toggle">Au clic (allumer / éteindre)</option></select>' +
          (parentStack.length === 0 ? '<label class="zi-check"><input type="checkbox" id="zf-fx-front"> Passe devant les personnages</label>' : '') +
        '</div>' +
        '<div class="form-actions">' +
          '<button id="zf-cancel">Annuler</button>' +
          '<button id="zf-create" class="primary">Créer la zone</button>' +
        '</div>' +
        '<div class="note">' + (diskMode ? "L'image ou le son associé se choisissent après création, dans le panneau de la zone." : "La création réelle de fichier (image/son associé) arrivera avec le branchement disque — pour l'instant la zone reste en mémoire du navigateur.") + '</div>' +
      '</div>';
    document.getElementById("stage").appendChild(overlay);

    const typeSel = overlay.querySelector("#zf-type");
    const sonWrap = overlay.querySelector("#zf-son-mode-wrap");
    const sceneWrap = overlay.querySelector("#zf-scene-target-wrap");
    const sceneTargetSel = overlay.querySelector("#zf-scene-target");
    if (diskMode) {
      scenesList.forEach(n => {
        if (n === currentSceneName) return;
        const opt = document.createElement("option");
        opt.value = n;
        opt.textContent = loadedSceneNames[n] || n;
        sceneTargetSel.appendChild(opt);
      });
    }
    const fxWrap = overlay.querySelector("#zf-fx-wrap");
    const fxKindSel = overlay.querySelector("#zf-fx-kind");
    const fxBehSel = overlay.querySelector("#zf-fx-behavior");
    const fxColorIn = overlay.querySelector("#zf-fx-color");
    const fxColor2Wrap = overlay.querySelector("#zf-fx-color2-wrap");
    function syncFxVisibility() {
      const k = fxKindSel.value;
      overlay.querySelector("#zf-fx-behavior-wrap").style.display = FX_BEHAVIORS[k] ? "block" : "none";
      fxColor2Wrap.style.display = (k === "lumiere" && fxBehSel.value === "gyro") ? "block" : "none";
      overlay.querySelector("#zf-fx-intensity-wrap").style.display = fxHasIntensity(k) ? "block" : "none";
      overlay.querySelector("#zf-fx-int-name").textContent = fxIntensityWord(k);
      overlay.querySelector("#zf-fx-int-hint").textContent = fxIntensityHint(k);
    }
    overlay.querySelector("#zf-fx-intensity").addEventListener("input", (e) => {
      overlay.querySelector("#zf-fx-int-val").textContent = e.target.value;
    });
    fxKindSel.addEventListener("change", () => {
      const k = fxKindSel.value;
      fxColorIn.value = FX_DEFAULT_COLOR[k];
      if (FX_BEHAVIORS[k]) fxBehSel.innerHTML = fxBehaviorOptionsHtml(k, fxBehaviorDefault(k));
      if (fxHasIntensity(k)) {
        overlay.querySelector("#zf-fx-intensity").value = fxDefaultIntensity(k);
        overlay.querySelector("#zf-fx-int-val").textContent = fxDefaultIntensity(k);
      }
      syncFxVisibility();
    });
    fxBehSel.addEventListener("change", () => {
      if (fxBehSel.value === "gyro") {
        fxColorIn.value = "#ff2a2a";
        overlay.querySelector("#zf-fx-color2").value = "#2a5bff";
      }
      syncFxVisibility();
    });
    function syncTypeVisibility() {
      sonWrap.style.display = typeSel.value === "son" ? "block" : "none";
      sceneWrap.style.display = (typeSel.value === "scene" && diskMode) ? "block" : "none";
      fxWrap.style.display = typeSel.value === "effet" ? "block" : "none";
      imgWrap.style.display = typeSel.value === "image" ? "block" : "none";
    }
    const imgWrap = overlay.querySelector("#zf-img-wrap");
    const imgModeSel = overlay.querySelector("#zf-img-mode");
    imgModeSel.addEventListener("change", () => {
      overlay.querySelector("#zf-img-duration-wrap").style.display = imgModeSel.value === "ephemere" ? "block" : "none";
    });
    syncTypeVisibility();
    typeSel.addEventListener("change", syncTypeVisibility);

    overlay.querySelector("#zf-cancel").addEventListener("click", () => overlay.remove());

    overlay.querySelector("#zf-create").addEventListener("click", () => {
      const nameInput = overlay.querySelector("#zf-name");
      const name = nameInput.value.trim();
      if (!name) { nameInput.focus(); return; }
      const type = typeSel.value;
      const soundMode = overlay.querySelector("#zf-son-mode").value;
      const baseId = slugify(name) + "-" + Math.random().toString(36).slice(2, 6);

      const zone = {
        id: baseId,
        name: name,
        points: pointsStr,
        type: type,
        icon: iconForType(type, soundMode)
      };
      if (type === "effet") {
        zone.effectKind = fxKindSel.value;
        zone.effectColor = fxColorIn.value;
        zone.effectMode = overlay.querySelector("#zf-fx-mode").value;
        const frontBox = overlay.querySelector("#zf-fx-front");
        if (frontBox && frontBox.checked) zone.effectFront = true;
        if (fxHasIntensity(zone.effectKind)) zone.effectIntensity = parseInt(overlay.querySelector("#zf-fx-intensity").value, 10);
        if (FX_BEHAVIORS[zone.effectKind]) {
          zone.effectBehavior = fxBehSel.value;
          if (zone.effectKind === "lumiere" && zone.effectBehavior === "gyro") zone.effectColor2 = overlay.querySelector("#zf-fx-color2").value;
        }
      } else if (type === "son") {
        zone.soundMode = soundMode;
        zone.cue = "Zone créée en édition — son à associer plus tard.";
      } else if (type === "image" || type === "personnage") {
        zone.insert = {
          title: name,
          caption: "Emplacement réservé : asset à associer une fois le branchement disque en place.",
          icon: iconForType(type, soundMode)
        };
      } else if (type === "scene") {
        if (diskMode && sceneTargetSel.value) {
          zone.target = sceneTargetSel.value;
        } else if (!diskMode) {
          const sceneId = baseId + "-scene";
          SCENES[sceneId] = { name: name, musicHue: 40 + Math.floor(Math.random() * 300) };
          zone.target = sceneId;
        }
      }

      if (type === "image") {
        zone.insertMode = imgModeSel.value;
        if (zone.insertMode === "ephemere") {
          zone.insertDuration = Math.max(1, Math.min(60, parseInt(overlay.querySelector("#zf-img-duration").value, 10) || 5));
        }
      }
      const list = getInsertionList(parentStack);
      if (list) list.push(zone);
      overlay.remove();
      if (diskMode) saveSceneToDisk();
      render();
    });
  }

  // ---------------------------------------------------------------
  // Synchro MJ -> Joueur (onglets dupliqués) via BroadcastChannel
  // ---------------------------------------------------------------

  function broadcastState() {
    if (!bc) return;
    bc.postMessage({
      type: "state",
      sceneId: state.sceneId,
      insertStack: state.insertStack,
      soundOn: state.soundOn,
      effectsOn: state.effectsOn,
      placedOn: state.placedOn,
      activeNpcOrder: activeNpcOrder,
      speakingNpc: speakingNpc,
      npcEmotes: Object.fromEntries(Object.entries(npcEmotes).map(([k, v]) => [k, { emoji: v.emoji, expiresAt: v.expiresAt }])),
      weatherRain: weatherRain,
      weatherSnow: weatherSnow,
      weatherFog: weatherFog,
      weatherStorm: weatherStorm,
      tensionVignette: tensionVignette,
      rainIntensity: rainIntensity,
      snowIntensity: snowIntensity,
      musicVolume: musicVolume
    });
  }
  function requestStateFromPeers() {
    if (!bc) return;
    bc.postMessage({ type: "request-state" });
  }
  if (bc) {
    bc.onmessage = async (ev) => {
      const msg = ev.data;
      if (!msg) return;
      if (msg.type === "request-state" && state.mode !== "player") {
        broadcastState();
      } else if (msg.type === "state" && state.mode === "player") {
        // si la scène a changé côté MJ, on va la charger nous-mêmes depuis
        // le disque (chaque onglet a sa propre lecture du dossier) avant
        // d'appliquer le reste de l'état — sinon le fond/les zones restent
        // figés sur l'ancienne scène.
        const sceneChanged = rootDirHandle && msg.sceneId && msg.sceneId !== currentSceneName;
        if (sceneChanged) {
          await loadSceneFromDisk(msg.sceneId);
        }
        state.sceneId = msg.sceneId;
        state.insertStack = msg.insertStack;
        state.soundOn = msg.soundOn;
        state.effectsOn = msg.effectsOn || {};
        const nextPlaced = msg.placedOn || {};
        Object.keys(nextPlaced).forEach(id => { if (nextPlaced[id] && !state.placedOn[id]) placedRevealAt[id] = performance.now(); });
        state.placedOn = nextPlaced;
        activeNpcOrder = msg.activeNpcOrder || [];
        speakingNpc = msg.speakingNpc || null;
        applyRemoteNpcEmotes(msg.npcEmotes || {});
        if (typeof msg.rainIntensity === "number") rainIntensity = msg.rainIntensity;
        if (typeof msg.snowIntensity === "number") snowIntensity = msg.snowIntensity;
        if (typeof msg.musicVolume === "number" && msg.musicVolume !== musicVolume) {
          musicVolume = msg.musicVolume;
          musicVolumeInput.value = musicVolume;
          musicAudioEl.volume = musicVolume / 100;
          rainAmbienceEl.volume = musicVolume / 100;
          stormAmbienceEl.volume = musicVolume / 100;
        }
        const weatherChanged = (typeof msg.weatherRain === "boolean" && msg.weatherRain !== weatherRain) ||
                                (typeof msg.weatherSnow === "boolean" && msg.weatherSnow !== weatherSnow) ||
                                (typeof msg.weatherFog === "boolean" && msg.weatherFog !== weatherFog) ||
                                (typeof msg.weatherStorm === "boolean" && msg.weatherStorm !== weatherStorm);
        if (typeof msg.weatherRain === "boolean") weatherRain = msg.weatherRain;
        if (typeof msg.weatherSnow === "boolean") weatherSnow = msg.weatherSnow;
        if (typeof msg.weatherFog === "boolean") weatherFog = msg.weatherFog;
        if (typeof msg.weatherStorm === "boolean") weatherStorm = msg.weatherStorm;
        weatherRainToggle.checked = weatherRain;
        weatherSnowToggle.checked = weatherSnow;
        weatherFogToggle.checked = weatherFog;
        weatherStormToggle.checked = weatherStorm;
        if (typeof msg.tensionVignette === "boolean" && msg.tensionVignette !== tensionVignette) {
          tensionVignette = msg.tensionVignette;
          tensionToggle.checked = tensionVignette;
          renderTensionVignette();
        }
        if (weatherChanged || sceneChanged) {
          renderWeather();
        } else {
          if (weatherRain) initRainDrops();
          if (weatherSnow) initSnowFlakes();
        }
        render();
        hydrateActiveNpcImages();
      } else if (msg.type === "effect") {
        if (msg.effect === "shake") playShake();
        else if (msg.effect === "zoom") playZoom();
      }
    };
  }

  // ---------------------------------------------------------------
  // Notes de scénario (UN fichier PDF/TXT/MD pour tout le scénario,
  // à la racine du dossier — indépendant des scènes, position retenue)
  // ---------------------------------------------------------------

  let scenarioDocFileName = null;
  let scenarioDocKind = null; // 'pdf' | 'text'
  let scenarioDocPosition = 0; // scrollTop (texte) ou n° de page (pdf)
  let scenarioDocObjectURL = null;

  async function saveScenarioDocConfig() {
    if (!rootDirHandle) return;
    try {
      const fh = await rootDirHandle.getFileHandle("scenario-doc.json", { create: true });
      const w = await fh.createWritable();
      await w.write(JSON.stringify({
        fileName: scenarioDocFileName,
        kind: scenarioDocKind,
        position: scenarioDocPosition
      }, null, 2));
      await w.close();
    } catch (e) {}
  }

  async function loadScenarioDocConfig() {
    scenarioDocFileName = null;
    scenarioDocKind = null;
    scenarioDocPosition = 0;
    if (!rootDirHandle) { renderScenarioDoc(); return; }
    try {
      const fh = await rootDirHandle.getFileHandle("scenario-doc.json");
      const file = await fh.getFile();
      const cfg = JSON.parse(await file.text());
      scenarioDocFileName = cfg.fileName || null;
      scenarioDocKind = cfg.kind || null;
      scenarioDocPosition = cfg.position || 0;
    } catch (e) {
      // pas encore de fichier choisi pour ce scénario
    }
    await renderScenarioDoc();
  }

  async function pickScenarioDoc() {
    if (!rootDirHandle) { showToast("Ouvre d'abord un dossier de scénario.", true); return; }
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: "Scénario", accept: { "application/pdf": [".pdf"], "text/plain": [".txt"], "text/markdown": [".md"] } }]
      });
      const file = await handle.getFile();
      await writeFileIntoDir(rootDirHandle, file.name, file);
      scenarioDocFileName = file.name;
      scenarioDocKind = /\.pdf$/i.test(file.name) ? "pdf" : "text";
      scenarioDocPosition = 0;
      await saveScenarioDocConfig();
      await renderScenarioDoc();
    } catch (e) {
      // sélection annulée
    }
  }

  function updateNotesSummary() {
    const el = document.getElementById("notes-summary");
    if (!rootDirHandle) {
      el.innerHTML = '<span class="empty">Ouvre un dossier de scénario.</span>';
      return;
    }
    if (!scenarioDocFileName) {
      el.innerHTML = '<span class="empty">Aucun fichier choisi.</span>';
      return;
    }
    el.innerHTML = '<button id="notes-open-float" class="notes-open-btn">📖 ' + scenarioDocFileName + '</button>';
    document.getElementById("notes-open-float").addEventListener("click", toggleNotesFloating);
  }

  function openNotesFloating() {
    if (!scenarioDocFileName) return;
    const overlay = document.getElementById("notes-floating-overlay");
    overlay.classList.remove("hidden");
    document.getElementById("notes-floating-title").textContent = scenarioDocFileName;
    requestAnimationFrame(() => {
      const viewEl = document.querySelector("#notes-floating-body .doc-text-view");
      if (viewEl) viewEl.scrollTop = scenarioDocPosition || 0;
    });
  }

  function closeNotesFloating() {
    document.getElementById("notes-floating-overlay").classList.add("hidden");
  }

  function toggleNotesFloating() {
    const overlay = document.getElementById("notes-floating-overlay");
    if (overlay.classList.contains("hidden")) openNotesFloating();
    else closeNotesFloating();
  }

  document.getElementById("notes-floating-close").addEventListener("click", closeNotesFloating);
  document.getElementById("notes-floating-header").addEventListener("click", closeNotesFloating);
  document.getElementById("notes-floating-overlay").addEventListener("click", (e) => {
    if (e.target.id === "notes-floating-overlay") closeNotesFloating();
  });

  async function renderScenarioDoc() {
    updateNotesSummary();
    const el = document.getElementById("notes-floating-body");
    if (!rootDirHandle) {
      el.innerHTML = '<span class="empty">Ouvre un dossier de scénario.</span>';
      return;
    }
    if (!scenarioDocFileName) {
      el.innerHTML = '<span class="empty">Aucun fichier choisi — clique 📁 pour sélectionner ton PDF ou TXT de scénario.</span>';
      return;
    }
    let file;
    try {
      const fh = await rootDirHandle.getFileHandle(scenarioDocFileName);
      file = await fh.getFile();
    } catch (e) {
      el.innerHTML = '<span class="empty">Fichier introuvable ("' + scenarioDocFileName + '"). Clique 📁 pour en choisir un autre.</span>';
      return;
    }

    el.innerHTML = '<div class="doc-file-name">' + scenarioDocFileName + '</div>';

    if (scenarioDocKind === "pdf") {
      if (scenarioDocObjectURL) URL.revokeObjectURL(scenarioDocObjectURL);
      scenarioDocObjectURL = URL.createObjectURL(file);
      const page = scenarioDocPosition || 1;

      const controls = document.createElement("div");
      controls.className = "doc-pdf-controls";
      controls.innerHTML =
        '<label>Page</label>' +
        '<input type="number" id="doc-page-input" min="1" value="' + page + '">' +
        '<button id="doc-page-go">Reprendre ici</button>';
      el.appendChild(controls);

      const iframe = document.createElement("iframe");
      iframe.className = "note-pdf doc-pdf-frame";
      iframe.src = scenarioDocObjectURL + "#page=" + page;
      el.appendChild(iframe);

      document.getElementById("doc-page-go").addEventListener("click", () => {
        const val = parseInt(document.getElementById("doc-page-input").value, 10) || 1;
        scenarioDocPosition = val;
        saveScenarioDocConfig();
        iframe.src = scenarioDocObjectURL + "#page=" + val;
      });
    } else {
      const text = await file.text();
      const viewEl = document.createElement("div");
      viewEl.className = "note-text doc-text-view";
      viewEl.textContent = text;
      el.appendChild(viewEl);

      let saveTimeout = null;
      viewEl.addEventListener("scroll", () => {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
          scenarioDocPosition = viewEl.scrollTop;
          saveScenarioDocConfig();
        }, 600);
      });
    }
  }

  document.getElementById("notes-pick").addEventListener("click", pickScenarioDoc);
  document.getElementById("notes-refresh").addEventListener("click", renderScenarioDoc);

  // ---------------------------------------------------------------
  // Si cette fenêtre a été ouverte par le bouton "Vue Joueur →" d'une
  // autre fenêtre du même outil, on demande le dossier déjà autorisé
  // là-bas, puis on bascule tout seul en vue Joueur (et on tente le
  // plein écran — ça peut être refusé par le navigateur puisque ce
  // n'est pas un clic direct dans CETTE fenêtre).
  function requestRootHandleFromOpener() {
    return new Promise((resolve) => {
      if (!window.opener) { resolve(null); return; }
      let settled = false;
      function onMsg(ev) {
        if (!ev.data || ev.data.type !== "root-handle") return;
        settled = true;
        window.removeEventListener("message", onMsg);
        resolve(ev.data.rootDirHandle || null);
      }
      window.addEventListener("message", onMsg);
      try {
        window.opener.postMessage({ type: "request-root-handle" }, "*");
      } catch (e) {}
      setTimeout(() => {
        if (!settled) {
          window.removeEventListener("message", onMsg);
          resolve(null);
        }
      }, 2000);
    });
  }

  async function bootstrapFromOpener() {
    const handle = await requestRootHandleFromOpener();
    if (!handle) return false;
    rootDirHandle = handle;
    await scanScenes();
    await scanNpcFolder();
    await scanMeteoFolder();
    await scanVracFolder();
    updateMosaicToggleVisibility();

    document.querySelectorAll(".mode-switch button").forEach(b => b.classList.remove("active"));
    state.mode = "player";
    render();
    loadScenarioDocConfig();
    requestStateFromPeers();

    try {
      await document.documentElement.requestFullscreen();
    } catch (e) {
      showFullscreenPrompt();
    }
    return true;
  }

  // Si le plein écran auto est refusé (le navigateur exige un vrai clic
  // dans CETTE fenêtre), on affiche un gros bouton qui, lui, marchera à
  // coup sûr puisque c'est un clic direct.
  function showFullscreenPrompt() {
    const overlay = document.createElement("div");
    overlay.id = "fullscreen-prompt";
    overlay.style.cssText =
      "position:fixed;inset:0;z-index:999;display:flex;align-items:center;" +
      "justify-content:center;background:rgba(0,0,0,0.75);cursor:pointer;";
    overlay.innerHTML =
      '<div style="background:#10171d;border:1px solid rgba(201,169,97,0.4);' +
      'border-radius:12px;padding:28px 36px;text-align:center;color:#c9a961;' +
      'font-family:Georgia, serif;font-size:1.1rem;">' +
      '🖥️ Cliquer pour passer en plein écran</div>';
    overlay.addEventListener("click", () => {
      document.documentElement.requestFullscreen().catch(() => {
        showToast("Plein écran toujours refusé — F11 pour l'activer à la main.", true);
      });
      overlay.remove();
    });
    document.body.appendChild(overlay);
  }

  (async () => {
    const ok = await bootstrapFromOpener();
    if (!ok) {
      render();
      loadScenarioDocConfig();
    }
  })();
})();
</script>
</body>
</html>
