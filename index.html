<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vision Malkavienne</title>
<style>
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#000; overflow:hidden;
    font-family: "Courier New", monospace;
  }
  #stage{
    position:fixed; inset:0; background:#000;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #portrait{
    position:absolute; inset:0; z-index:1;
    width:100%; height:100%;
    background-size:cover; background-position:center;
    transform: scale(1);
    background-color:#1a1a1a;
  }
  #vision-flash{
    position:absolute; inset:0; z-index:3;
    background-color:#050000;
    opacity:0;
    overflow:hidden;
  }
  .glitch-band{
    position:absolute; inset:0;
    background-size:cover; background-position:center;
    will-change:transform;
  }
  #red-pulse{
    position:absolute; inset:0; z-index:4; pointer-events:none;
    background: rgba(120,0,0,0.35);
    mix-blend-mode: multiply;
    opacity:0;
  }
  #vignette{
    position:absolute; inset:0; z-index:5; pointer-events:none;
    box-shadow: inset 0 0 180px 50px rgba(0,0,0,0.8);
  }
  #scanlines{
    position:absolute; inset:0; z-index:6; pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.08) 0px,
      rgba(255,255,255,0.08) 1px,
      transparent 2px,
      transparent 4px
    );
    opacity:0;
  }
  #set-selector{
    position:fixed; top:10px; left:10px; z-index:60;
    display:flex; gap:6px; flex-wrap:wrap; max-width:90%;
    font-family: "Courier New", monospace;
  }
  #set-selector.hidden{ display:none; }
  #set-selector button{
    background:#111; color:#888; border:1px solid #333;
    padding:4px 9px; font-size:11px; letter-spacing:.5px;
    cursor:pointer; font-family:inherit;
  }
  #set-selector button.active{ color:#eee; border-color:#900; background:#1a0505; }
  #set-selector button:hover{ color:#ccc; }

  /* ---- fin de vision : invite + écran « journal » (à screenshoter) ---- */
  #journal-prompt{
    position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    z-index:20; padding:10px 18px; border:1px solid #7a1a1a; border-radius:999px;
    background:rgba(8,0,0,.72); color:#e6d9c8;
    font:italic 15px/1.2 Georgia,"Times New Roman",serif; white-space:nowrap;
    cursor:pointer; opacity:0; pointer-events:none; transition:opacity .8s ease;
  }
  #journal-prompt.show{ opacity:1; pointer-events:auto; }
  #journal-screen{
    position:fixed; inset:0; z-index:30; display:none;
    background:#000 center/cover no-repeat;
  }
  #journal-screen.show{ display:block; }
  #journal-text{
    position:absolute; left:0; right:0; bottom:0; box-sizing:border-box;
    padding:64px 22px calc(26px + env(safe-area-inset-bottom));
    background:linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.82) 36%, rgba(0,0,0,.93));
    color:#eadfce; font:italic clamp(15px,4.2vw,20px)/1.5 Georgia,"Times New Roman",serif;
    white-space:pre-wrap; max-height:62%; overflow-y:auto;
  }
  #journal-text:empty{ display:none; }
  body.journal-open #set-selector{ display:none; }
</style>
<script src="hors-ligne.js" data-depot="visions" data-raw></script>
</head>
<body>

<div id="stage">
  <div id="portrait"></div>
  <div id="vision-flash">
    <div class="glitch-band"></div>
    <div class="glitch-band"></div>
    <div class="glitch-band"></div>
    <div class="glitch-band"></div>
    <div class="glitch-band"></div>
  </div>
  <div id="red-pulse"></div>
  <div id="scanlines"></div>
  <div id="vignette"></div>
</div>

<div id="set-selector"></div>

<div id="journal-prompt">Noter dans mon journal ?</div>
<div id="journal-screen"><div id="journal-text"></div></div>


<audio id="audio-horror" preload="auto"></audio>

/* ============================================================
   CONFIG — à éditer une seule fois
   (le dépôt GitHub où se trouve le dossier d'images "vision/")
   ============================================================ */
const GITHUB_OWNER = "ashteroash-sudo";
const GITHUB_REPO  = "visions";
const GITHUB_BASE_PATH = "vision"; // dossier parent — soit les images sont dedans, soit des sous-dossiers = plusieurs jeux de visions

/* ============================================================

   Ajuste ces 4 valeurs à ton écran, en pixels depuis le coin

   ============================================================ */
const POPUP_WIDTH  = 640;
const POPUP_HEIGHT = 760;
const POPUP_LEFT   = 1200;
const POPUP_TOP    = 150;

const urlParams = new URLSearchParams(location.search);
const VISION_FIXE = urlParams.get('set'); // lien direct vers UNE vision (ex. sur téléphone)

if (!urlParams.has('popup') && !VISION_FIXE) {
  const sep = location.href.includes('?') ? '&' : '?';
  const features = `width=${POPUP_WIDTH},height=${POPUP_HEIGHT},left=${POPUP_LEFT},top=${POPUP_TOP},toolbar=no,location=no,menubar=no,status=no,scrollbars=no,resizable=yes`;
  window.open(location.href + sep + 'popup=1', 'visionMalkavienne', features);
  document.documentElement.innerHTML = '<body style="background:#000;color:#555;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">Fenêtre de vision ouverte à côté — tu peux fermer cet onglet.</body>';
} else {
  runVisionPage();
}

const ZOOM_AMOUNT = 2.6;
const FALLBACK_PER_IMAGE_DURATION = 500; // ms, utilisé seulement si pas de son

const portraitEl = document.getElementById('portrait');
const visionFlash = document.getElementById('vision-flash');
const glitchBands = Array.from(visionFlash.querySelectorAll('.glitch-band'));
const redPulse = document.getElementById('red-pulse');
const scanlines = document.getElementById('scanlines');

let visionImages = [];

let playing = false;

portraitEl.style.backgroundImage = `url(${DEFAULT_PORTRAIT_1})`;
audioEl.src = DEFAULT_AUDIO;

const IMAGE_EXT = /\.(png|jpe?g|webp|gif)$/i;

async function fetchGithubContents(path){
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`GitHub a répondu ${res.status} pour ${path}`);
  return res.json();
}

function naturalSort(a,b){
  return a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:'base'});
}

async function loadVisionSets(){
  try{
    const data = await fetchGithubContents(GITHUB_BASE_PATH);
    const dirs = data.filter(item => item.type === 'dir').sort(naturalSort);
    if(dirs.length){
      visionSets = dirs.map(d => ({ name: d.name, path: d.path }));
    } else {
      // pas de sous-dossiers : les images sont directement dans vision/ (mode simple)
      visionSets = [{ name: 'visions', path: GITHUB_BASE_PATH }];
    }
  } catch(err){
    console.error("Impossible de charger les dossiers de visions:", err);
    visionSets = [];
  }
  renderSetSelector();
  let start = 0;
  if(VISION_FIXE){
    const cible = VISION_FIXE.normalize('NFC').toLowerCase();
    const i = visionSets.findIndex(s => s.name.normalize('NFC').toLowerCase() === cible);
    if(i >= 0){ start = i; setSelectorEl.classList.add('hidden'); }
    else console.warn("Vision introuvable :", VISION_FIXE);
  }
  if(visionSets.length) await selectSet(start);
}

const JOURNAL_IMAGE = /^journal\.(png|jpe?g)$/i;

async function loadSetContent(path){
  const out = { images: [], journalImage: null, journalText: '' };
  try{
    const data = await fetchGithubContents(path);
    const files = data.filter(item => item.type === 'file').sort(naturalSort);
    const imgs = files.filter(f => IMAGE_EXT.test(f.name));
    out.images = imgs.map(f => f.download_url);               // journal.* se joue comme les autres
    const j = imgs.find(f => JOURNAL_IMAGE.test(f.name));
    if(j) out.journalImage = j.download_url;
    const txts = files.filter(f => /\.txt$/i.test(f.name));
    const t = txts.find(f => /^journal\.txt$/i.test(f.name)) || txts[0];
    if(t){
      const r = await fetch(t.download_url);
      if(r.ok) out.journalText = (await r.text()).trim();
    }
  } catch(err){
    console.error("Impossible de charger le contenu du set", path, err);
  }
  return out;
}

async function selectSet(index){
  if(index < 0 || index >= visionSets.length) return;
  currentSetIndex = index;
  const c = await loadSetContent(visionSets[index].path);
  visionImages = c.images;
  journalImage = c.journalImage;
  journalText = c.journalText;
  highlightSelector();
}

function renderSetSelector(){
  setSelectorEl.innerHTML = '';
  visionSets.forEach((set, i)=>{
    const btn = document.createElement('button');
    btn.textContent = `${i+1}. ${set.name}`;
    btn.addEventListener('click', ()=> selectSet(i));
    setSelectorEl.appendChild(btn);
  });
  highlightSelector();
}

function highlightSelector(){
  Array.from(setSelectorEl.children).forEach((btn, i)=>{
    btn.classList.toggle('active', i === currentSetIndex);
  });
}

const setsReady = loadVisionSets();

// Sur téléphone, le son doit être « débloqué » par le tout premier toucher
let audioDebloque = false;
function debloquerAudio(){
  if(audioDebloque) return;
  audioDebloque = true;
  audioEl.muted = true;
  audioEl.play()
    .then(()=>{ audioEl.pause(); audioEl.currentTime = 0; audioEl.muted = false; })
    .catch(()=>{ audioEl.muted = false; });
}
stage.addEventListener('click', ()=>{ debloquerAudio(); playSequence(); });
window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(k === 'r'){ playSequence(); return; }
  if(VISION_FIXE) return;   // lien direct : pas de changement de vision au clavier
  if(k === 'h'){ setSelectorEl.classList.toggle('hidden'); return; }
  const n = parseInt(e.key, 10);
  if(!isNaN(n) && n >= 1 && n <= visionSets.length){ selectSet(n-1); }
});

// découpe l'image en bandes horizontales fixes, décalées indépendamment pendant le flash
glitchBands.forEach((band, i)=>{
  const strip = 100 / glitchBands.length;
  band.style.clipPath = `inset(${i*strip}% 0 ${100-(i+1)*strip}% 0)`;
});

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

/* ---- écran « journal » : image journal.* + texte, prêt à screenshoter ---- */
const journalPrompt = document.getElementById('journal-prompt');
const journalScreen = document.getElementById('journal-screen');
const journalTextEl = document.getElementById('journal-text');

function masquerJournal(){
  journalPrompt.classList.remove('show');
  journalScreen.classList.remove('show');
  document.body.classList.remove('journal-open');
}
journalPrompt.addEventListener('click', ()=>{
  journalScreen.style.backgroundImage = `url("${journalImage || DEFAULT_PORTRAIT_2}")`;
  journalTextEl.textContent = journalText;
  journalPrompt.classList.remove('show');
  journalScreen.classList.add('show');
  document.body.classList.add('journal-open');
});

function getAudioDuration(){
  return new Promise(resolve=>{
    if(!audioEl.src){ resolve(0); return; }
    if(audioEl.readyState >= 1 && !isNaN(audioEl.duration) && audioEl.duration > 0){
      resolve(audioEl.duration);
    } else {
      const onLoaded = ()=>{
        audioEl.removeEventListener('loadedmetadata', onLoaded);
        resolve(audioEl.duration || 0);
      };
      audioEl.addEventListener('loadedmetadata', onLoaded);
    }
  });
}

async function playSequence(){
  if(playing) return;
  playing = true;
  masquerJournal();
  await setsReady;
  portraitEl.style.transition = 'none';
  portraitEl.style.transform = 'scale(1)';
  portraitEl.style.backgroundImage = `url(${DEFAULT_PORTRAIT_1})`;
  visionFlash.style.opacity = 0;
  redPulse.style.opacity = 0;
  await sleep(30);

  // 1) ZOOM IN AGRESSIF sur "avant"
  portraitEl.style.transition = 'transform 700ms cubic-bezier(.7,0,.9,.4)';
  requestAnimationFrame(()=>{
    portraitEl.style.transform = `scale(${ZOOM_AMOUNT})`;
  });
  await sleep(700);

  // 2) FLASH : chaque image répétée 2 fois sur la durée du son, avec artefacts
  const audioDuration = await getAudioDuration(); // secondes, 0 si pas de son
  const totalFlashMs = audioDuration > 0
    ? audioDuration * 1000
    : (visionImages.length ? visionImages.length * FALLBACK_PER_IMAGE_DURATION * 2 : 1500);
  const REPEATS = 2;
  const totalFrames = visionImages.length ? visionImages.length * REPEATS : 6;
  const perImageMs = totalFlashMs / totalFrames;

  if(audioEl.src){
    audioEl.currentTime = 0;
    audioEl.play().catch(()=>{});
  }

  let running = true;
  visionFlash.style.transition = 'none';
  visionFlash.style.opacity = 1;
  (async ()=>{
    let frame = 0;
    while(running && frame < totalFrames){
      const idx = frame % (visionImages.length || 1);
      const url = visionImages.length ? visionImages[idx] : null;

      // glitch : chaque bande horizontale de l'image se décale indépendamment
      glitchBands.forEach(band=>{
        if(url) band.style.backgroundImage = `url(${url})`;
        const glitchy = Math.random() < 0.45; // certaines bandes déraillent plus que d'autres
        const dx = glitchy ? (Math.random()-0.5) * 90 : (Math.random()-0.5) * 10;
        band.style.transform = `translateX(${dx}px)`;
      });

      // léger tremblement global + teinte discrète (pas d'inversion)
      const dx = (Math.random()-0.5) * 14;
      const dy = (Math.random()-0.5) * 8;
      visionFlash.style.transform = `translate(${dx}px, ${dy}px)`;
      visionFlash.style.filter = `contrast(${1.1 + Math.random()*0.2}) saturate(${1.1 + Math.random()*0.25}) hue-rotate(${(Math.random()-0.5)*10}deg)`;

      // scanlines qui clignotent
      scanlines.style.opacity = 0.12 + Math.random()*0.28;

      // le portrait en fond vibre aussi
      portraitEl.style.transform = `scale(${ZOOM_AMOUNT}) translate(${(Math.random()-0.5)*14}px, ${(Math.random()-0.5)*14}px)`;

      redPulse.style.opacity = (frame % 2 === 0) ? 0.55 : 0.2;
      await sleep(perImageMs);

      frame++;
    }
    scanlines.style.opacity = 0;
  })();

  // le flash dure exactement la durée du son (ou, à défaut, la longueur du dossier d'images)
  await new Promise(resolve=>{
    if(audioEl.src){
      const onEnd = ()=>{ audioEl.removeEventListener('ended', onEnd); resolve(); };
      audioEl.addEventListener('ended', onEnd);
    } else {
      setTimeout(resolve, totalFlashMs);
    }
  });
  running = false;
  visionFlash.style.opacity = 0;
  visionFlash.style.transform = 'none';
  visionFlash.style.filter = 'none';
  glitchBands.forEach(band=> band.style.transform = 'none');
  scanlines.style.opacity = 0;
  redPulse.style.opacity = 0;

  // 3) ZOOM OUT sur "après"
  portraitEl.style.backgroundImage = `url(${DEFAULT_PORTRAIT_2})`;
  portraitEl.style.transition = 'transform 900ms cubic-bezier(.16,1,.3,1)';
  portraitEl.style.transform = 'scale(1)';

  await sleep(900);
  playing = false;
  if(journalImage || journalText) journalPrompt.classList.add('show');
}

} // fin runVisionPage
</script>
</body>
</html>
