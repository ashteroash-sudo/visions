<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Vision Malkavienne</title>
<style>
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#000; overflow:hidden;
    font-family: "Courier New", monospace;
  }
  #stage{
    position:fixed; inset:0; background:#000;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #portrait{
    position:absolute; inset:0; z-index:1;
    width:100%; height:100%;
    background-size:cover; background-position:center;
    transform: scale(1);
    background-color:#1a1a1a;
  }
  #vision-flash{
    position:absolute; inset:0; z-index:3;
    background-color:#050000;
    opacity:0;
    overflow:hidden;
  }
  .glitch-band{
    position:absolute; inset:0;
    background-size:cover; background-position:center;
    will-change:transform;
  }
  #red-pulse{
    position:absolute; inset:0; z-index:4; pointer-events:none;
    background: rgba(120,0,0,0.35);
    mix-blend-mode: multiply;
    opacity:0;
  }
  #vignette{
    position:absolute; inset:0; z-index:5; pointer-events:none;
    box-shadow: inset 0 0 180px 50px rgba(0,0,0,0.8);
  }
  #scanlines{
    position:absolute; inset:0; z-index:6; pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.08) 0px,
      rgba(255,255,255,0.08) 1px,
      transparent 2px,
      transparent 4px
    );
    opacity:0;
  }
  #set-selector{
    position:fixed; top:10px; left:10px; z-index:60;
    display:flex; gap:6px; flex-wrap:wrap; max-width:90%;
    font-family: "Courier New", monospace;
  }
  #set-selector.hidden{ display:none; }
  #set-selector button{
    background:#111; color:#888; border:1px solid #333;
    padding:4px 9px; font-size:11px; letter-spacing:.5px;
    cursor:pointer; font-family:inherit;
  }
  #set-selector button.active{ color:#eee; border-color:#900; background:#1a0505; }
  #set-selector button:hover{ color:#ccc; }
</style>
<script src="hors-ligne.js" data-depot="visions" data-raw></script>
</head>
<body>

<div id="stage">
  <div id="portrait"></div>
  <div id="vision-flash">
    <div class="glitch-band"></div>
    <div class="glitch-band"></div>
    <div class="glitch-band"></div>
    <div class="glitch-band"></div>
    <div class="glitch-band"></div>
  </div>
  <div id="red-pulse"></div>
  <div id="scanlines"></div>
  <div id="vignette"></div>
</div>

<div id="set-selector"></div>


<audio id="audio-horror" preload="auto"></audio>

const POPUP_HEIGHT = 760;
const POPUP_LEFT   = 1200;
const POPUP_TOP    = 150;

} else {
  runVisionPage();
}

const ZOOM_AMOUNT = 2.6;
const FALLBACK_PER_IMAGE_DURATION = 500; // ms, utilisé seulement si pas de son

const portraitEl = document.getElementById('portrait');
const visionFlash = document.getElementById('vision-flash');
const glitchBands = Array.from(visionFlash.querySelectorAll('.glitch-band'));
const redPulse = document.getElementById('red-pulse');
const scanlines = document.getElementById('scanlines');
const stage = document.getElementById('stage');
const audioEl = document.getElementById('audio-horror');
const setSelectorEl = document.getElementById('set-selector');

let visionImages = [];
let visionSets = [];       // [{name, path}]
let currentSetIndex = 0;
let playing = false;

portraitEl.style.backgroundImage = `url(${DEFAULT_PORTRAIT_1})`;
audioEl.src = DEFAULT_AUDIO;

const IMAGE_EXT = /\.(png|jpe?g|webp|gif)$/i;

async function fetchGithubContents(path){
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`GitHub a répondu ${res.status} pour ${path}`);
  return res.json();
}

function naturalSort(a,b){
  return a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:'base'});
}

async function loadVisionSets(){
  try{
    const data = await fetchGithubContents(GITHUB_BASE_PATH);
    const dirs = data.filter(item => item.type === 'dir').sort(naturalSort);
    if(dirs.length){
      visionSets = dirs.map(d => ({ name: d.name, path: d.path }));
    } else {
      // pas de sous-dossiers : les images sont directement dans vision/ (mode simple)
      visionSets = [{ name: 'visions', path: GITHUB_BASE_PATH }];
    }
  } catch(err){
    console.error("Impossible de charger les dossiers de visions:", err);
    visionSets = [];
  }
  renderSetSelector();
  if(visionSets.length) await selectSet(0);
}

async function loadImagesForSet(path){
  try{
    const data = await fetchGithubContents(path);
    const files = data
      .filter(item => item.type === 'file' && IMAGE_EXT.test(item.name))
      .sort(naturalSort);
    return files.map(f => f.download_url);
  } catch(err){
    console.error("Impossible de charger les images du set", path, err);
    return [];
  }
}

async function selectSet(index){
  if(index < 0 || index >= visionSets.length) return;
  currentSetIndex = index;
  visionImages = await loadImagesForSet(visionSets[index].path);
  highlightSelector();
}

function renderSetSelector(){
  setSelectorEl.innerHTML = '';
  visionSets.forEach((set, i)=>{
    const btn = document.createElement('button');
    btn.textContent = `${i+1}. ${set.name}`;
    btn.addEventListener('click', ()=> selectSet(i));
    setSelectorEl.appendChild(btn);
  });
  highlightSelector();
}

function highlightSelector(){
  Array.from(setSelectorEl.children).forEach((btn, i)=>{
    btn.classList.toggle('active', i === currentSetIndex);
  });
}

loadVisionSets();
stage.addEventListener('click', playSequence);
window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(k === 'r'){ playSequence(); return; }
  if(k === 'h'){ setSelectorEl.classList.toggle('hidden'); return; }
  const n = parseInt(e.key, 10);
  if(!isNaN(n) && n >= 1 && n <= visionSets.length){ selectSet(n-1); }
});

// découpe l'image en bandes horizontales fixes, décalées indépendamment pendant le flash
glitchBands.forEach((band, i)=>{
  const strip = 100 / glitchBands.length;
  band.style.clipPath = `inset(${i*strip}% 0 ${100-(i+1)*strip}% 0)`;
});

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

function getAudioDuration(){
  return new Promise(resolve=>{
    if(!audioEl.src){ resolve(0); return; }
    if(audioEl.readyState >= 1 && !isNaN(audioEl.duration) && audioEl.duration > 0){
      resolve(audioEl.duration);
    } else {
      const onLoaded = ()=>{
        audioEl.removeEventListener('loadedmetadata', onLoaded);
        resolve(audioEl.duration || 0);
      };
      audioEl.addEventListener('loadedmetadata', onLoaded);
    }
  });
}

async function playSequence(){
  if(playing) return;
  playing = true;
  portraitEl.style.transition = 'none';
  portraitEl.style.transform = 'scale(1)';
  portraitEl.style.backgroundImage = `url(${DEFAULT_PORTRAIT_1})`;
  visionFlash.style.opacity = 0;
  redPulse.style.opacity = 0;
  await sleep(30);

  // 1) ZOOM IN AGRESSIF sur "avant"
  portraitEl.style.transition = 'transform 700ms cubic-bezier(.7,0,.9,.4)';
  requestAnimationFrame(()=>{
    portraitEl.style.transform = `scale(${ZOOM_AMOUNT})`;
  });
  await sleep(700);

  // 2) FLASH : chaque image répétée 2 fois sur la durée du son, avec artefacts
  const audioDuration = await getAudioDuration(); // secondes, 0 si pas de son
  const totalFlashMs = audioDuration > 0
    ? audioDuration * 1000
    : (visionImages.length ? visionImages.length * FALLBACK_PER_IMAGE_DURATION * 2 : 1500);
  const REPEATS = 2;
  const totalFrames = visionImages.length ? visionImages.length * REPEATS : 6;
  const perImageMs = totalFlashMs / totalFrames;

  if(audioEl.src){
    audioEl.currentTime = 0;
    audioEl.play().catch(()=>{});
  }

  let running = true;
  visionFlash.style.transition = 'none';
  visionFlash.style.opacity = 1;
  (async ()=>{
    let frame = 0;
    while(running && frame < totalFrames){
      const idx = frame % (visionImages.length || 1);
      const url = visionImages.length ? visionImages[idx] : null;

      // glitch : chaque bande horizontale de l'image se décale indépendamment
      glitchBands.forEach(band=>{
        if(url) band.style.backgroundImage = `url(${url})`;
        const glitchy = Math.random() < 0.45; // certaines bandes déraillent plus que d'autres
        const dx = glitchy ? (Math.random()-0.5) * 90 : (Math.random()-0.5) * 10;
        band.style.transform = `translateX(${dx}px)`;
      });

      // léger tremblement global + teinte discrète (pas d'inversion)
      const dx = (Math.random()-0.5) * 14;
      const dy = (Math.random()-0.5) * 8;
      visionFlash.style.transform = `translate(${dx}px, ${dy}px)`;
      visionFlash.style.filter = `contrast(${1.1 + Math.random()*0.2}) saturate(${1.1 + Math.random()*0.25}) hue-rotate(${(Math.random()-0.5)*10}deg)`;

      // scanlines qui clignotent
      scanlines.style.opacity = 0.12 + Math.random()*0.28;

      // le portrait en fond vibre aussi
      portraitEl.style.transform = `scale(${ZOOM_AMOUNT}) translate(${(Math.random()-0.5)*14}px, ${(Math.random()-0.5)*14}px)`;

      redPulse.style.opacity = (frame % 2 === 0) ? 0.55 : 0.2;
      await sleep(perImageMs);

      frame++;
    }
    scanlines.style.opacity = 0;
  })();

  // le flash dure exactement la durée du son (ou, à défaut, la longueur du dossier d'images)
  await new Promise(resolve=>{
    if(audioEl.src){
      const onEnd = ()=>{ audioEl.removeEventListener('ended', onEnd); resolve(); };
      audioEl.addEventListener('ended', onEnd);
    } else {
      setTimeout(resolve, totalFlashMs);
    }
  });
  running = false;
  visionFlash.style.opacity = 0;
  visionFlash.style.transform = 'none';
  visionFlash.style.filter = 'none';
  glitchBands.forEach(band=> band.style.transform = 'none');
  scanlines.style.opacity = 0;
  redPulse.style.opacity = 0;

  // 3) ZOOM OUT sur "après"
  portraitEl.style.backgroundImage = `url(${DEFAULT_PORTRAIT_2})`;
  portraitEl.style.transition = 'transform 900ms cubic-bezier(.16,1,.3,1)';
  portraitEl.style.transform = 'scale(1)';

  await sleep(900);
  playing = false;
}

} // fin runVisionPage
</script>
