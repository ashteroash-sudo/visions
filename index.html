<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Vision Malkavienne</title>
<style>
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#000; overflow:hidden;
    font-family: "Courier New", monospace;
  }
  #stage{
    position:fixed; inset:0; background:#000;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #portrait{
    position:absolute; inset:0; z-index:1;
    width:100%; height:100%;
    background-size:cover; background-position:center;
    transform: scale(1);
    background-color:#1a1a1a;
  }
  #vision-flash{
    position:absolute; inset:0; z-index:3;
    background-size:cover; background-position:center;
    background-color:#050000;
    opacity:0;
  }
  #red-pulse{
    position:absolute; inset:0; z-index:4; pointer-events:none;
    background: rgba(120,0,0,0.35);
    mix-blend-mode: multiply;
    opacity:0;
  }
  #vignette{
    position:absolute; inset:0; z-index:5; pointer-events:none;
    box-shadow: inset 0 0 180px 50px rgba(0,0,0,0.8);
  }
  #scanlines{
    position:absolute; inset:0; z-index:6; pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.08) 0px,
      rgba(255,255,255,0.08) 1px,
      transparent 2px,
      transparent 4px
    );
    opacity:0;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="portrait"></div>
  <div id="vision-flash"></div>
  <div id="red-pulse"></div>
  <div id="scanlines"></div>
  <div id="vignette"></div>
</div>

<audio id="audio-horror" preload="auto"></audio>

/* ============================================================
   CONFIG — à éditer une seule fois
   (le dépôt GitHub où se trouve le dossier d'images "vision/")
   ============================================================ */
const GITHUB_OWNER = "ashteroash-sudo";
const GITHUB_REPO  = "visions";
const GITHUB_PATH  = "vision"; // nom du dossier d'images, à la racine du dépôt

/* ============================================================
   FENÊTRE DÉTACHÉE — position/taille de la fenêtre sans barre
   Ajuste ces 4 valeurs à ton écran, en pixels depuis le coin
   haut-gauche de ton écran principal.
   ============================================================ */
const POPUP_WIDTH  = 640;
const POPUP_HEIGHT = 760;
const POPUP_LEFT   = 1200;
const POPUP_TOP    = 150;

if (!location.search.includes('popup=1')) {
  const sep = location.href.includes('?') ? '&' : '?';
  const features = `width=${POPUP_WIDTH},height=${POPUP_HEIGHT},left=${POPUP_LEFT},top=${POPUP_TOP},toolbar=no,location=no,menubar=no,status=no,scrollbars=no,resizable=yes`;
  window.open(location.href + sep + 'popup=1', 'visionMalkavienne', features);
  document.documentElement.innerHTML = '<body style="background:#000;color:#555;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">Fenêtre de vision ouverte à côté — tu peux fermer cet onglet.</body>';
} else {
  runVisionPage();
}

const ZOOM_AMOUNT = 2.6;
const FALLBACK_PER_IMAGE_DURATION = 500; // ms, utilisé seulement si pas de son

const portraitEl = document.getElementById('portrait');
const visionFlash = document.getElementById('vision-flash');
const redPulse = document.getElementById('red-pulse');
const scanlines = document.getElementById('scanlines');
const stage = document.getElementById('stage');
const audioEl = document.getElementById('audio-horror');

let visionImages = [];
let playing = false;

portraitEl.style.backgroundImage = `url(${DEFAULT_PORTRAIT_1})`;
audioEl.src = DEFAULT_AUDIO;

const IMAGE_EXT = /\.(png|jpe?g|webp|gif)$/i;

async function loadVisionsFromGithub(){
  try{
    const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error(`GitHub a répondu ${res.status}`);
    const data = await res.json();
    const files = data
      .filter(item => item.type === 'file' && IMAGE_EXT.test(item.name))
      .sort((a,b)=> a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:'base'}));
    visionImages = files.map(f => f.download_url);
    if(visionImages.length === 0){
      console.warn("0 vision trouvée dans le dossier", GITHUB_PATH);
    }
  } catch(err){
    console.error("Impossible de charger les visions depuis GitHub:", err);
  }
}

loadVisionsFromGithub();
stage.addEventListener('click', playSequence);
window.addEventListener('keydown', e=>{ if(e.key.toLowerCase()==='r') playSequence(); });

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

function getAudioDuration(){
  return new Promise(resolve=>{
    if(!audioEl.src){ resolve(0); return; }
    if(audioEl.readyState >= 1 && !isNaN(audioEl.duration) && audioEl.duration > 0){
      resolve(audioEl.duration);
    } else {
      const onLoaded = ()=>{
        audioEl.removeEventListener('loadedmetadata', onLoaded);
        resolve(audioEl.duration || 0);
      };
      audioEl.addEventListener('loadedmetadata', onLoaded);
    }
  });
}

async function playSequence(){
  if(playing) return;
  playing = true;
  portraitEl.style.transition = 'none';
  portraitEl.style.transform = 'scale(1)';
  portraitEl.style.backgroundImage = `url(${DEFAULT_PORTRAIT_1})`;
  visionFlash.style.opacity = 0;
  redPulse.style.opacity = 0;
  await sleep(30);

  // 1) ZOOM IN AGRESSIF sur "avant"
  portraitEl.style.transition = 'transform 700ms cubic-bezier(.7,0,.9,.4)';
  requestAnimationFrame(()=>{
    portraitEl.style.transform = `scale(${ZOOM_AMOUNT})`;
  });
  await sleep(700);

  // 2) FLASH : chaque image répétée 2 fois sur la durée du son, avec artefacts
  const audioDuration = await getAudioDuration(); // secondes, 0 si pas de son
  const totalFlashMs = audioDuration > 0
    ? audioDuration * 1000
    : (visionImages.length ? visionImages.length * FALLBACK_PER_IMAGE_DURATION * 2 : 1500);
  const REPEATS = 2;
  const totalFrames = visionImages.length ? visionImages.length * REPEATS : 6;
  const perImageMs = totalFlashMs / totalFrames;

  if(audioEl.src){
    audioEl.currentTime = 0;
    audioEl.play().catch(()=>{});
  }

  let running = true;
  visionFlash.style.transition = 'none';
  visionFlash.style.opacity = 1;
  (async ()=>{
    let frame = 0;
    while(running && frame < totalFrames){
      const idx = frame % (visionImages.length || 1);
      if(visionImages.length){
        visionFlash.style.backgroundImage = `url(${visionImages[idx]})`;
      }

      // artefacts visuels marqués : jitter large + décalage chromatique + inversion aléatoire
      const dx = (Math.random()-0.5) * 45;
      const dy = (Math.random()-0.5) * 28;
      const skew = (Math.random()-0.5) * 9;
      const glitchInvert = Math.random() < 0.3 ? 'invert(1)' : '';
      visionFlash.style.transform = `translate(${dx}px, ${dy}px) skewX(${skew}deg) scale(${1.06 + Math.random()*0.1})`;
      visionFlash.style.filter = `${glitchInvert} contrast(${1.3 + Math.random()*0.5}) saturate(${1.4 + Math.random()*0.8}) hue-rotate(${(Math.random()-0.5)*40}deg)`;

      // scanlines qui clignotent
      scanlines.style.opacity = 0.15 + Math.random()*0.35;

      // le portrait en fond vibre aussi
      portraitEl.style.transform = `scale(${ZOOM_AMOUNT}) translate(${(Math.random()-0.5)*14}px, ${(Math.random()-0.5)*14}px)`;

      redPulse.style.opacity = (frame % 2 === 0) ? 0.55 : 0.2;
      await sleep(perImageMs);

      frame++;
    }
    scanlines.style.opacity = 0;
  })();

  // le flash dure exactement la durée du son (ou, à défaut, la longueur du dossier d'images)
  await new Promise(resolve=>{
    if(audioEl.src){
      const onEnd = ()=>{ audioEl.removeEventListener('ended', onEnd); resolve(); };
      audioEl.addEventListener('ended', onEnd);
    } else {
      setTimeout(resolve, totalFlashMs);
    }
  });
  running = false;
  visionFlash.style.opacity = 0;
  visionFlash.style.transform = 'none';
  visionFlash.style.filter = 'none';
  scanlines.style.opacity = 0;
  redPulse.style.opacity = 0;

  // 3) ZOOM OUT sur "après"
  portraitEl.style.backgroundImage = `url(${DEFAULT_PORTRAIT_2})`;
  portraitEl.style.transition = 'transform 900ms cubic-bezier(.16,1,.3,1)';
  portraitEl.style.transform = 'scale(1)';

  await sleep(900);
  playing = false;
}

} // fin runVisionPage
</script>
